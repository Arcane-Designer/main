<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#1c201e"><meta name="description" content="Personal goals, habits, and routines.">
 <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
 <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Blastforge">
 <title>Blastforge</title>
 <link rel="icon" href="./assets/favicon-64.png" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
 <link rel="preload" as="image" href="./assets/forge-poster.jpg" fetchpriority="high">
 <link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css?v=15">
</head>
<body>
 <div class="scene" aria-hidden="true"><img class="scene-poster" src="./assets/forge-poster.jpg" alt="" fetchpriority="high"></div><div class="snow" aria-hidden="true"></div>
 <div class="app-shell">
  <header class="masthead">
   <a class="brand" href="./" aria-label="Open the forge" title="The forge"><span class="brand-mark"><img src="./assets/anvil.webp" alt="" width="52" height="52"></span><span>BLASTFORGE</span></a>
   <div class="masthead-actions"><button id="add-goal" class="add-button" aria-label="Add goal" title="Add goal"><span data-icon="plus"></span></button><button id="settings-open" class="settings-button" aria-label="Settings"><span data-icon="settings"></span></button></div>
  </header>
  <nav class="game-nav" aria-label="Sections"><button data-section="goals" class="active" aria-current="page"><span data-icon="flag"></span><span>Goals</span></button><button data-section="dragon"><span data-art="dragon"></span><span>Dragon</span></button><button data-section="craft"><span data-art="hammer"></span><span>Craft</span></button><button data-section="games"><span data-art="dice"></span><span>Games</span></button><button data-section="vault"><span data-art="chest"></span><span>Vault</span></button><button data-section="isles"><span data-art="map"></span><span>Isles</span></button></nav>
  <nav class="main-nav" aria-label="Goal views"><div class="tabs"><button data-view="today" class="active" aria-current="page"><span data-icon="sun"></span>Today</button><button data-view="upcoming"><span data-icon="calendar"></span>Upcoming</button><button data-view="history"><span data-icon="history"></span>History</button><button data-view="goals"><span data-icon="flag"></span>All goals</button></div></nav>
  <main id="main" tabindex="-1"></main>
  <footer><span class="footer-flame" data-icon="flame"></span> Keep the fire going.</footer>
 </div>
 <dialog id="goal-dialog" class="modal"><form id="goal-form"><header><div class="editor-heading"><span class="editor-emblem" aria-hidden="true"><img src="./assets/anvil.webp" alt=""></span><h2 id="goal-dialog-title">New goal</h2></div><button type="button" class="icon-button close" aria-label="Close goal editor">×</button></header>
  <input name="id" type="hidden"><label>Goal name<input name="title" required maxlength="100"></label>
  <div class="form-pair"><label>Category<select name="category"><option>Health</option><option>Movement</option><option>Creative</option><option>Learning</option><option>Hobbies</option><option>Personal</option></select></label><label>Repeat<select name="schedule"><option value="daily">Every day</option><option value="days">Specific weekdays</option><option value="weekly">Flexible days each week</option><option value="monthly">Monthly goal</option><option value="once">One-time goal</option></select></label></div>
  <label id="apply-field">Apply to<select name="applyTo"><option value="future">This goal going forward</option><option value="day">Only this day</option></select></label><p id="apply-help" class="help"></p>
  <label id="metric-target-field" hidden>Follower target<input name="metricTarget" type="number" min="1" max="100000000"></label>
  <fieldset id="weekdays"><legend>Which days?</legend><div class="day-picker"></div></fieldset>
  <div class="form-pair"><label id="target-field">Days each week<input name="target" type="number" min="1" max="7" value="2"></label><label id="due-field">Due date<input name="due" type="date"></label><label>Time <span class="muted">(optional)</span><input name="time" type="time"></label></div>
  <label id="placement-field">Show it<select name="placement"><option value="day">On that day’s list</option><option value="longer">With longer goals</option></select></label>
  <label>Notes <span class="muted">(optional)</span><textarea name="notes" rows="2" maxlength="1200"></textarea></label>
  <label id="routine-day-field">Routine for<select name="routineDay"><option value="1">Monday</option><option value="3">Wednesday</option><option value="5">Friday</option><option value="6">Saturday</option></select></label>
  <label><span id="steps-label">Smaller steps</span> <span class="muted">(one per line)</span><textarea name="steps" rows="4" maxlength="4000"></textarea></label><p id="routine-help" class="help"></p>
  <div class="dialog-actions"><button type="button" id="archive-goal" class="quiet danger">Archive goal</button><button type="button" class="quiet close">Cancel</button><button type="submit" class="primary">Save goal</button></div><p id="goal-error" class="error" role="alert"></p>
 </form></dialog>
 <dialog id="move-dialog" class="modal"><form id="move-form"><header><h2>Move this time</h2><button type="button" class="icon-button close" aria-label="Close move dialog">×</button></header><p id="move-goal-name"></p><label>Move to<input name="date" type="date" required></label><p class="help">Only this occurrence moves. The repeating schedule stays the same.</p><p id="move-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet close">Cancel</button><button type="submit" class="primary">Move this time</button></div></form></dialog>
 <dialog id="settings-dialog" class="modal"><header><h2>Settings</h2><button class="icon-button close" aria-label="Close settings">×</button></header>
  <label class="motion-setting"><span>Animated background</span><input id="background-motion" type="checkbox" checked></label>
  <label class="motion-setting"><span>Sound</span><input id="sound-setting" type="checkbox" checked></label>
  <label class="motion-setting" id="badge-row"><span>Goals left today on the app icon<small class="setting-help">On iPhone, allow notifications when asked so the number can show.</small></span><input id="badge-setting" type="checkbox" checked></label>
  <label class="motion-setting" id="theme-row" hidden><span>Workshop theme</span><select id="theme-setting"></select></label>
  <div class="settings-status" role="status"><span class="sync-dot"></span><span id="sync-label">Saved on this device</span></div><p id="footer-status" class="help"></p>
  <div class="connection-card"><span class="connection-label">Connection code</span><code id="connection-code"></code><button class="quiet" id="copy-link">Copy link</button></div>
  <form id="connect-form"><label>Connect another device<input name="code" placeholder="Connection code" autocomplete="off" spellcheck="false" required></label><button class="primary" type="submit">Connect</button></form>
  <p id="connection-message" class="help" role="status"></p><div class="settings-row"><button class="quiet" id="sync-now">Sync now</button><button class="quiet" id="export">Save backup</button><label class="quiet file-label">Restore backup<input id="import" type="file" accept="application/json,.json"></label></div>
 </dialog>
 <dialog id="progress-dialog" class="modal"><form id="progress-form"><header><h2>Keene followers</h2><button type="button" class="icon-button close" aria-label="Close follower update">×</button></header><label>Current follower count<input name="followers" type="number" min="0" max="100000000" required></label><p class="help">One count updates your October, November, and December milestones.</p><div class="dialog-actions"><button type="button" class="quiet close">Cancel</button><button class="primary" type="submit">Save count</button></div></form></dialog>
 <dialog id="forge-dialog" class="forge-dialog" aria-label="The forge"></dialog>
 <div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js?v=15"></script><script type="module" src="./scene.js?v=11"></script>
</body></html>
