<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#1c201e">
<title>Blastforge has moved</title>
<meta http-equiv="refresh" content="3; url=https://sarge-deputy-games.nathanagellatly.workers.dev/blastforge/">
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c201e;color:#f3e2c6;font:17px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
 a{color:#efb56b}
</style>
</head>
<body>
<main>
 <h1>Blastforge has moved</h1>
 <p>It now lives on Sarge &amp; Deputy Games, with one account for every device.</p>
 <p><a href="https://sarge-deputy-games.nathanagellatly.workers.dev/blastforge/">Open the new Blastforge</a></p>
</main>
<script>
// Old installs kept a saved copy of the app; clear it so this page (and the new address) take over.
if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
if(window.caches)caches.keys().then(ks=>ks.filter(k=>k.startsWith('blastforge-')).forEach(k=>caches.delete(k)));
</script>
</body>
</html>
