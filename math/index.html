<!DOCTYPE html>
<html lang="en">
<head>
<!--site:start-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07050e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quick Math">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--site:end-->
<title>Quick Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=Tilt+Neon&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&text=暗算ラーメンカオケ電脳ホテル薬酒場夜市ゲム寿司未来喫茶占い&display=swap">
<style>
:root {
  color-scheme: dark;
  --night: #07050e;
  --ink: #ece6ff;
  --dim: #7a70a3;
  --mute: #3a3160;
  --pink: #ff2e97;
  --pink-core: #ffe4f2;
  --cyan: #22eeff;
  --cyan-core: #e4fdff;
  --amber: #ffb547;
  --amber-core: #fff1da;
  --fault: #ff3548;
  --display: "Tilt Neon", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --glow-pink: 0 0 .03em #fff, 0 0 .1em var(--pink), 0 0 .26em var(--pink), 0 0 .6em rgba(255, 46, 151, .5);
  --glow-cyan: 0 0 .03em #fff, 0 0 .1em var(--cyan), 0 0 .26em var(--cyan), 0 0 .55em rgba(34, 238, 255, .45);
  --glow-amber: 0 0 .03em #fff, 0 0 .1em var(--amber), 0 0 .26em var(--amber), 0 0 .55em rgba(255, 181, 71, .45);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font: 400 13px/1.4 var(--mono);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
[hidden] { display: none !important; }
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 4px; }

#city { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
#fx i { position: absolute; inset: 0; opacity: 0; }
#fx .ok { box-shadow: inset 0 0 140px rgba(34, 238, 255, .28); }
#fx .bad {
  background: repeating-linear-gradient(0deg, rgba(255, 53, 72, .09) 0 2px, transparent 2px 4px), rgba(255, 20, 60, .08);
  box-shadow: inset 0 0 180px rgba(255, 53, 72, .45);
}
#fx i.run { animation: fxflash .34s ease-out; }
@keyframes fxflash { 0% { opacity: 0 } 12% { opacity: 1 } 100% { opacity: 0 } }

.screen {
  position: fixed;
  inset: 0;
  z-index: 2;
  padding: calc(var(--st) + 10px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);
}
.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse 60% 48% at 50% 42%, rgba(6, 4, 12, .5), rgba(6, 4, 12, 0) 72%);
}
#results::before { background: radial-gradient(ellipse 64% 56% at 50% 46%, rgba(6, 4, 12, .78), rgba(6, 4, 12, 0) 76%), rgba(6, 4, 12, .25); }
#stats::before { background: radial-gradient(ellipse 64% 56% at 50% 46%, rgba(6, 4, 12, .7), rgba(6, 4, 12, 0) 76%), rgba(6, 4, 12, .5); }
.icon { width: 44px; height: 44px; display: grid; place-items: center; color: var(--dim); transition: color .15s; }
.icon:hover { color: var(--ink); }
.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- menu ---------- */
#menu { display: grid; place-items: center; }
.corner { position: absolute; top: calc(var(--st) + 6px); right: calc(var(--sr) + 8px); display: flex; }
#b-sound .s-off, #b-sound.muted .s-on { display: none; }
#b-sound.muted .s-off { display: block; }
.menu-core { display: grid; justify-items: center; gap: clamp(16px, 3.3vh, 30px); transform: translateY(-6vh); }
.menu-core > *, .res > * { animation: boot .7s linear both; animation-delay: calc(var(--i, 0) * 75ms); }
@keyframes boot { 0% { opacity: 0 } 10% { opacity: .85 } 16% { opacity: .1 } 28% { opacity: 1 } 36% { opacity: .3 } 50%, 100% { opacity: 1 } }
.modes { display: flex; gap: clamp(10px, 3.6vw, 34px); }
.modes button {
  font: 600 clamp(12px, .45vw + 7px, 15px)/1 var(--mono);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--dim);
  padding: 12px 2px;
  transition: color .15s, text-shadow .15s;
}
.modes button:hover { color: var(--ink); }
.modes button.on { color: var(--cyan-core); text-shadow: 0 0 6px var(--cyan), 0 0 16px rgba(34, 238, 255, .6); }
.ops { display: flex; gap: clamp(8px, 2.6vw, 20px); }
.ops.off { visibility: hidden; }
.ops button {
  width: clamp(56px, 4.4vw, 72px);
  height: clamp(56px, 4.4vw, 72px);
  display: grid;
  place-items: center;
  font: clamp(40px, 3.1vw, 52px)/1 var(--display);
  color: var(--mute);
  transition: color .15s, text-shadow .15s;
}
.ops button:hover { color: var(--dim); }
.ops button.on { color: var(--cyan-core); text-shadow: var(--glow-cyan); }
.ops button.nope { animation: nope .3s; }
@keyframes nope { 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
.levels { display: flex; align-items: flex-end; height: clamp(44px, 3.4vw, 54px); }
.levels button { width: 26px; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.levels i { display: block; width: 8px; height: calc(var(--h) * 1%); border: 1px solid var(--mute); transition: background .15s, box-shadow .15s, border-color .15s; }
.levels button:hover i { border-color: var(--dim); }
.levels button.on i { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan), 0 0 18px rgba(34, 238, 255, .45); }
.go {
  font: clamp(30px, 2.3vw, 38px)/1 var(--display);
  letter-spacing: .06em;
  color: var(--pink-core);
  padding: 15px 44px 17px;
  border: 2px solid var(--pink);
  border-radius: 7px;
  text-shadow: 0 0 .1em var(--pink), 0 0 .3em var(--pink);
  box-shadow: 0 0 10px var(--pink), 0 0 32px rgba(255, 46, 151, .35), inset 0 0 12px rgba(255, 46, 151, .45);
  transition: transform .12s, box-shadow .15s;
}
.go:hover { box-shadow: 0 0 14px var(--pink), 0 0 44px rgba(255, 46, 151, .5), inset 0 0 16px rgba(255, 46, 151, .6); }
.go:active { transform: scale(.97); }
.best { font: 400 clamp(11px, .75vw, 13px)/1 var(--mono); letter-spacing: .2em; color: var(--amber); }
.best b { font-weight: 600; letter-spacing: .08em; text-shadow: 0 0 10px rgba(255, 181, 71, .6); }

/* ---------- play ---------- */
#play { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "hud" "arena" "pad"; }
.hud { grid-area: hud; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.hud .icon { margin-left: -10px; }
.hud-mid {
  font: 600 clamp(22px, 1.8vw, 28px)/1 var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: .04em;
  text-align: center;
  min-width: 4ch;
  transition: color .2s;
}
.hud-mid.low { color: var(--fault); text-shadow: 0 0 12px rgba(255, 53, 72, .8); }
.pip { display: inline-block; width: 9px; height: 9px; margin: 0 5px; border-radius: 50%; border: 1px solid var(--mute); vertical-align: middle; }
.pip.on { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 8px var(--pink); }
.hud-score {
  justify-self: end;
  font: 600 clamp(22px, 1.8vw, 28px)/1 var(--mono);
  font-variant-numeric: tabular-nums;
  transform-origin: 100% 50%;
  transition: color .3s, text-shadow .3s;
}
.hud-score.ahead { color: var(--cyan-core); text-shadow: 0 0 10px var(--cyan); }
.pop { animation: pop .2s ease-out; }
@keyframes pop { 40% { transform: scale(1.22) } }
.arena {
  grid-area: arena;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .12em;
  min-height: 0;
  padding-bottom: 12vh;
}
.sign { font: 96px/1 var(--display); color: var(--pink-core); text-shadow: var(--glow-pink); white-space: nowrap; min-height: 1em; }
.sign.ig { animation: ig .16s linear; }
.sign.fl { animation: fl .07s ease-out; }
.sign.short { animation: short .5s linear; }
@keyframes ig { 0% { opacity: .2 } 30% { opacity: 1 } 45% { opacity: .55 } 60% { opacity: 1 } }
@keyframes fl { from { opacity: .25 } }
@keyframes short { 0% { opacity: 1 } 8% { opacity: .2 } 14% { opacity: 1 } 22% { opacity: .35 } 30% { opacity: .9 } 44% { opacity: .15 } 52%, 100% { opacity: 1 } }
.answer {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 1.1em;
  font: 86px/1 var(--display);
  color: var(--cyan-core);
  text-shadow: var(--glow-cyan);
  white-space: nowrap;
}
.answer.off { visibility: hidden; }
.caret {
  display: block;
  width: .07em;
  height: .78em;
  margin-left: .07em;
  background: var(--cyan);
  box-shadow: 0 0 .12em var(--cyan), 0 0 .3em rgba(34, 238, 255, .6);
  animation: blink 1.05s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0 } }
.answer.bad, .answer.rev { justify-content: center; }
.answer.bad .caret, .answer.rev .caret, .paused .caret { display: none; }
.answer.bad {
  color: #ffd9dd;
  text-shadow: -.05em 0 rgba(34, 238, 255, .7), .05em 0 rgba(255, 53, 72, .9), 0 0 .3em rgba(255, 53, 72, .8);
  animation: glitch .3s steps(2);
}
@keyframes glitch {
  20% { transform: translate(-.05em, .01em) skewX(-9deg) }
  40% { transform: translate(.05em, -.01em) skewX(7deg) }
  60% { transform: translate(-.03em, 0) }
  80% { transform: translate(.02em, 0) skewX(-3deg) }
}
.answer.rev { color: var(--amber-core); text-shadow: var(--glow-amber); }
.note { min-height: 26px; font: 400 clamp(11px, .8vw, 13px)/1 var(--mono); letter-spacing: .16em; color: var(--pink); display: flex; align-items: center; gap: 8px; text-align: center; max-width: 100%; }
.note b { font: clamp(22px, 1.8vw, 28px)/1 var(--display); letter-spacing: 0; color: var(--pink-core); text-shadow: var(--glow-pink); }
.note.seq { color: var(--amber); letter-spacing: .06em; font-size: 13px; line-height: 1.5; white-space: normal; justify-content: center; }
.paused .arena { opacity: .3; }
.pad { grid-area: pad; display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100%, 420px); justify-self: center; padding-top: 8px; touch-action: none; }
.pad button {
  height: clamp(50px, 8vh, 70px);
  display: grid;
  place-items: center;
  border: 1px solid rgba(125, 105, 200, .28);
  border-radius: 8px;
  background: rgba(12, 8, 26, .6);
  font: 30px/1 var(--display);
  color: var(--cyan-core);
  text-shadow: 0 0 .15em rgba(34, 238, 255, .7);
  transition: background .14s, border-color .14s, box-shadow .14s;
  touch-action: none;
}
.pad button svg { width: 26px; height: 26px; fill: none; stroke: var(--cyan-core); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(34, 238, 255, .7)); }
.pad button.down { background: rgba(34, 238, 255, .2); border-color: var(--cyan); box-shadow: 0 0 16px rgba(34, 238, 255, .35); transition: none; }
.pad .blank { visibility: hidden; }
@media (pointer: coarse) {
  .pad { display: grid; }
  .arena { padding-bottom: 0; }
}
body.kbd .pad { display: none; }
@media (pointer: coarse) and (orientation: landscape) and (max-height: 540px) {
  #play { grid-template-columns: minmax(0, 1fr) minmax(220px, 40%); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "hud hud" "arena pad"; column-gap: 16px; }
  .pad { align-self: center; padding-top: 0; }
  .pad button { height: clamp(40px, 17vh, 60px); }
}

.echo {
  position: fixed;
  z-index: 3;
  pointer-events: none;
  font-family: var(--display);
  line-height: 1;
  color: var(--cyan-core);
  text-shadow: var(--glow-cyan);
  transform: translate(-50%, -50%);
  animation: echo .34s ease-out forwards;
}
@keyframes echo { to { transform: translate(-50%, -50%) scale(1.35); opacity: 0; } }
.float { position: fixed; z-index: 3; pointer-events: none; font: 600 13px/1 var(--mono); transform: translate(-50%, 0); animation: floatup .8s ease-out forwards; }
.float.ok { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
.float.bad { color: var(--fault); text-shadow: 0 0 8px var(--fault); }
@keyframes floatup { to { transform: translate(-50%, -28px); opacity: 0; } }
.shake { animation: shake .26s linear; }
@keyframes shake { 20% { transform: translate(-6px, 2px) } 40% { transform: translate(5px, -2px) } 60% { transform: translate(-3px, 1px) } 80% { transform: translate(2px, 0) } }

/* ---------- results ---------- */
#results { display: grid; place-items: center; overflow-y: auto; }
.res { display: grid; justify-items: center; gap: 16px; width: min(100%, 520px); transform: translateY(-3vh); }
.r-score { font: clamp(96px, 24vw, 176px)/.9 var(--display); color: var(--pink-core); text-shadow: var(--glow-pink); }
.r-score.gold { color: var(--amber-core); text-shadow: var(--glow-amber); }
.r-flag { min-height: 11px; font: 600 11px/1 var(--mono); letter-spacing: .3em; color: var(--amber); }
.r-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; padding-top: 6px; }
.r-stats div { display: grid; justify-items: center; gap: 8px; }
.r-stats b { font: 400 clamp(30px, 2.4vw, 38px)/1 var(--display); color: var(--cyan-core); text-shadow: 0 0 .1em var(--cyan), 0 0 .3em rgba(34, 238, 255, .5); }
.r-stats span { font: 400 clamp(10px, .7vw, 12px)/1 var(--mono); letter-spacing: .14em; color: var(--dim); }
.r-spark { width: min(100%, 300px); aspect-ratio: 300 / 56; overflow: visible; }
.r-miss { display: grid; grid-template-columns: repeat(2, auto); gap: 8px 30px; font: 400 clamp(13px, .9vw, 15px)/1.2 var(--mono); color: #ff8d98; }
.r-miss b { color: var(--amber); font-weight: 600; }
.r-actions { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
.ghost { font: 600 12px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--dim); padding: 18px 18px; transition: color .15s; }
.ghost:hover { color: var(--ink); }

/* ---------- stats ---------- */
#stats { display: grid; place-items: center; overflow-y: auto; }
.st-head { position: absolute; top: calc(var(--st) + 6px); left: calc(var(--sl) + 6px); }
.st-core { display: grid; justify-items: center; gap: 20px; padding-top: 30px; }
.tower-wrap { position: relative; padding: 12px; background: rgba(10, 7, 22, .88); border: 1px solid #211a3c; }
.mast { position: absolute; left: 50%; bottom: 100%; width: 2px; height: 26px; margin-left: -1px; background: #211a3c; }
.mast::after { content: ""; position: absolute; left: -2px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: #ff2b3a; box-shadow: 0 0 8px #ff2b3a; animation: beacon 1.6s steps(1) infinite; }
@keyframes beacon { 50% { opacity: .15 } }
.tower { --c: clamp(16px, calc((100vw - 110px) / 12), 30px); display: grid; grid-template-columns: repeat(12, var(--c)); grid-auto-rows: var(--c); gap: 3px; }
.tower .h { display: grid; place-items: center; font: 400 9px/1 var(--mono); color: var(--dim); }
.tower .c { background: #141026; border: 1px solid #241c42; cursor: pointer; }
.tower .c.seen { border-color: transparent; }
.tower .c.sel { outline: 1px solid var(--ink); outline-offset: 1px; }
.st-read { min-height: 18px; font: 400 13px/1.4 var(--mono); color: var(--ink); text-align: center; }
.st-read span { color: var(--dim); margin-left: 14px; }
.st-tot { display: flex; gap: 44px; }
.st-tot div { display: grid; justify-items: center; gap: 8px; }
.st-tot b { font: 400 32px/1 var(--display); color: var(--cyan-core); text-shadow: 0 0 .1em var(--cyan), 0 0 .3em rgba(34, 238, 255, .5); }
.st-tot span { font: 400 clamp(10px, .7vw, 12px)/1 var(--mono); letter-spacing: .14em; color: var(--dim); }

@media (max-height: 640px) {
  .menu-core { gap: 12px; transform: none; }
  .res { gap: 10px; transform: none; }
  .r-score { font-size: clamp(72px, 16vh, 120px); }
}
@media (prefers-reduced-motion: reduce) {
  .menu-core > *, .res > *, .sign.ig, .sign.fl, .sign.short, .answer.bad, .shake, .pop, .caret { animation: none !important; }
  .echo, .float { animation-duration: .01s !important; }
}
</style>
</head>
<body>
<canvas id="city" aria-hidden="true"></canvas>
<div id="fx" aria-hidden="true"><i class="ok"></i><i class="bad"></i></div>

<section id="menu" class="screen">
  <div class="corner">
    <button class="icon" id="b-stats" aria-label="Stats"><svg viewBox="0 0 24 24"><path d="M8 21V6.5h8V21M12 6.5V2.5"/><path d="M10.6 10h.01M13.4 10h.01M10.6 13.5h.01M13.4 13.5h.01M10.6 17h.01M13.4 17h.01"/></svg></button>
    <button class="icon" id="b-sound" aria-label="Sound"><svg class="s-on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a7.8 7.8 0 0 1 0 11"/></svg><svg class="s-off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  </div>
  <div class="menu-core">
    <div class="modes" role="radiogroup" aria-label="Mode" style="--i:0">
      <button id="m-sprint" role="radio" data-mode="sprint">Sprint</button>
      <button id="m-survival" role="radio" data-mode="survival">Survival</button>
      <button id="m-flash" role="radio" data-mode="flash">Flash</button>
      <button id="m-zen" role="radio" data-mode="zen">Zen</button>
    </div>
    <div class="ops" role="group" aria-label="Operations" style="--i:1">
      <button id="o-add" data-op="add" aria-label="Addition">+</button>
      <button id="o-sub" data-op="sub" aria-label="Subtraction">−</button>
      <button id="o-mul" data-op="mul" aria-label="Multiplication">×</button>
      <button id="o-div" data-op="div" aria-label="Division">÷</button>
    </div>
    <div class="levels" role="radiogroup" aria-label="Level" style="--i:2">
      <button id="l-1" role="radio" data-level="1" aria-label="Level 1"><i style="--h:34"></i></button>
      <button id="l-2" role="radio" data-level="2" aria-label="Level 2"><i style="--h:56"></i></button>
      <button id="l-3" role="radio" data-level="3" aria-label="Level 3"><i style="--h:78"></i></button>
      <button id="l-4" role="radio" data-level="4" aria-label="Level 4"><i style="--h:100"></i></button>
    </div>
    <button id="b-go" class="go" style="--i:3">Start</button>
    <div class="best" id="best" style="--i:4">best <b>0</b></div>
  </div>
</section>

<section id="play" class="screen" hidden>
  <div class="hud">
    <button class="icon" id="b-quit" aria-label="Quit"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    <div class="hud-mid" id="h-mid"></div>
    <div class="hud-score" id="h-score">0</div>
  </div>
  <div class="arena" id="arena">
    <div class="sign" id="sign"></div>
    <div class="answer off" id="answer"><span id="typed"></span><i class="caret"></i></div>
    <div class="note" id="note"></div>
  </div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>

    const L = [

      { k: 2, hMin: .1, hMax: port ? .32 : .29, wMin: port ? .2 : .07, wMax: port ? .34 : .15, min: 36, fill: '#08060f', cell: Math.max(7, H * .0135), wa: 1 },

    const midRects = B[1].flatMap(b => b.rects);

    const words = shuffle(WORDS.slice(), R);
    const cand = shuffle([...B[1].filter(b => b.w >= 20), ...B[2].filter(b => b !== hb && b.w >= 26)], R);
    const maxS = port ? 5 : 9;
    for (const b of cand) {
      if (signs.length >= maxS) break;
      if (R() < .4) continue;
      const s = makeSign(R, b, words[signs.length % words.length], SC[signs.length % SC.length], false);
      if (!s) continue;

      if (inner < ww) return;

      const rows = Math.floor((b.h - padT - ch * .4) / ch);

        idx.push(wins.length);
        wins.push({ x: Math.round(x * D), y: Math.round(y * D), w: Math.max(1, Math.round(w * D)), h: Math.max(1, Math.round(h * D)), c, a: Lr.wa, b: 0, t: 0, s: 4, d: 0 });

      }

    }

    for (const b of B[1]) {

      if (b.ant && !nearRects.some(r => hit({ x: b.ant.x - 2, y: b.ant.y - 2, w: 4, h: 4 }, r))) blinks.push({ x: b.ant.x + .5, y: b.ant.y, ph: R(), sp: .6 + R() * .3 });
    }
    band(g, .55, 'rgba(34,12,52,.36)');
    for (const b of B[2]) {

    }
    band(g, .82, 'rgba(255,46,151,.16)');
    const vg = g.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .35, W / 2, H * .45, M * .8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);

    const tall = B[2].filter(b => b !== hb).sort((a, b) => b.h - a.h);
    for (const b of [tall[0], hb].filter(Boolean)) beams.push({ x: b.x + b.w / 2, y: b.top - (b.crown || 0), a0: -Math.PI / 2 + (R() - .5) * .5, amp: .32 + R() * .2, sp: .1 + R() * .08, ph: R() * 6 });

    wl = canvas(cv.width, cv.height); wx = wl.getContext('2d');

    for (const w of wins) if (Math.random() < f0) { w.b = w.t = 1; litN++; paint(w); }
    for (const s of signs) { s.seq = null; s.b = s.t = mode === 'ambient' || s === hero ? 1 : 0; if (s === hero && mode !== 'ambient') s.b = s.t = .3 + .7 * power(); }

  function paint(w) {

  function spawnCar(fast) {

})();

    el.play.classList.remove('paused');
    el.score.classList.remove('ahead');
    setScore(0);
    setNote('');
    hideAnswer();
    fit();
    hud(true);
    City.gameStart();
    countdown(begin);
  },
  digit(d) {
    const r = run;
    if (!r || r.paused || r.phase !== 'ask' || r.input.length >= 6) return;
    r.input += d;
    setTyped(r.input);
    const target = String(r.mode === 'flash' ? r.sum : r.p.ans);
    if (r.input.length >= target.length) judge(r.input === target);
  },
  back() {
    const r = run;
    if (!r || r.paused || r.phase !== 'ask' || !r.input) return;
    r.input = r.input.slice(0, -1);
    setTyped(r.input);
  },
  submit() {
    const r = run;
    if (!r || r.paused || r.phase !== 'ask' || !r.input) return;
    judge(r.input === String(r.mode === 'flash' ? r.sum : r.p.ans));
  },
  quit() {
    const r = run;
    if (!r || r.phase === 'end') return;
    if (r.mode === 'zen' && r.tries) return end();
    run = null;
    saveProgress();
    toMenu();
  },
  pause() {
    const r = run;
    if (!r || r.paused || r.phase === 'end') return;
    r.paused = true;
    r.pausedAt = now();
    el.play.classList.add('paused');
  },
  resume() {
    const r = run;
    if (!r || !r.paused) return;
    r.paused = false;
    r.t0 += now() - r.pausedAt;
    el.play.classList.remove('paused');
    if (r.phase === 'flash') { countdown(startRound); return; }
    if ((r.mode === 'sprint' || r.mode === 'survival') && (r.phase === 'ask' || r.phase === 'reveal')) {
      const ph = r.phase, p = r.p, input = r.input;
      countdown(() => {
        if (ph === 'reveal') return next();
        r.phase = 'ask'; r.t0 = now();
        setSign(p.text, 'ig'); setTyped(input);
      });
    }
  },
  tick(dt) {
    const r = run;
    if (!r || r.paused) return;
    switch (r.phase) {
      case 'count':
        r.cdT -= dt;
        if (r.cdT <= 0) {
          r.cd--;
          if (r.cd > 0) { r.cdT += CD; setSign(String(r.cd), 'ig'); Sfx.count(false); }
          else { const f = r.after; r.after = null; f(); }
        }
        break;
      case 'ask':
      case 'reveal':
        if (r.mode === 'sprint' || r.mode === 'survival') {
          r.clock -= dt;
          if (r.clock <= 0) { r.clock = 0; hud(); end(); return; }
        }
        if (r.phase === 'reveal') {
          r.rv -= dt;
          const swapAt = r.mode === 'flash' ? 1.2 : r.mode === 'zen' ? .85 : .52;
          if (!r.swapped && r.rv <= swapAt) { r.swapped = true; setTyped(String(r.mode === 'flash' ? r.sum : r.p.ans), 'rev'); }
          if (r.rv <= 0) {
            if (r.mode !== 'flash') next();
            else if (r.lives <= 0) end();
            else startRound();
          }
        }
        break;
      case 'flash': flashTick(dt); break;
      case 'wait': r.wait -= dt; if (r.wait <= 0) startRound(); break;
    }
    if (run) hud();
  },
};

function countdown(after) {
  const r = run;
  r.phase = 'count'; r.cd = 3; r.cdT = CD; r.after = after;
  hideAnswer();
  setSign('3', 'ig');
  Sfx.count(false);
}
function begin() {
  Sfx.count(true);
  if (run.mode === 'flash') startRound(); else next();
}
function next() {
  const r = run;
  r.retry.forEach(q => q.due--);
  const qi = r.retry.findIndex(q => q.due <= 0);
  const prev = r.p && r.p.text;
  r.p = qi >= 0 ? r.retry.splice(qi, 1)[0].p : (r.mode === 'zen' ? genSmart : genPlain)(r.level, r.ops, prev);
  r.input = ''; r.phase = 'ask'; r.t0 = now();
  setSign(r.p.text, 'ig');
  setTyped('');
}
function judge(ok) {
  const r = run, t = (now() - r.t0) / 1000;
  r.tries++;
  if (r.mode === 'flash') return flashJudge(ok, t);
  recordFact(r.p.key, ok, t);
  if (ok) {
    r.right++; r.score++; r.streak++; r.top = Math.max(r.top, r.streak); r.times.push(t); meta.solved++;
    let bonus = 0;
    if (r.mode === 'survival') { bonus = survBonus(r); r.clock = Math.min(survCap(r), r.clock + bonus); }
    good(r, bonus);
    next();
  } else {
    r.streak = 0;
    r.misses.push(r.p);
    if (r.retry.length < 6 && !r.retry.some(q => q.p.text === r.p.text)) r.retry.push({ p: r.p, due: randi(3, 5) });
    let pen = 0;
    if (r.mode === 'survival') { pen = 2.5; r.clock = Math.max(0, r.clock - pen); }
    r.phase = 'reveal'; r.rv = r.mode === 'zen' ? 1.15 : .8; r.swapped = false;
    bad(r, pen);
  }
}
function good(r, bonus) {
  Sfx.correct(r.streak);
  echo(r.input);
  const rc = el.answer.getBoundingClientRect();
  City.spark(rc.left + rc.width / 2, rc.top + rc.height * .3, 'ok');
  City.lightUp(r.streak, r.mode === 'flash' ? 3 : 1);
  setScore(r.score, true);
  fxFlash('ok');
  if (r.mode !== 'flash') setNote(r.streak >= 3 ? `streak <b>${r.streak}</b>` : '');
  if (bonus) floater('+' + bonus.toFixed(1), 'ok');
  if (r.streak % 5 === 0 && City.igniteOne()) Sfx.buzz();
  if (r.streak % 10 === 0) { Sfx.surge(); City.surge(); }
}
function bad(r, pen) {
  Sfx.wrong();
  Haptic.buzz();
  setTyped(r.input, 'bad');
  el.sign.classList.remove('ig', 'fl', 'short'); reflow(el.sign); el.sign.classList.add('short');
  const rc = el.sign.getBoundingClientRect();
  City.spark(rc.left + rc.width / 2, rc.bottom - rc.height * .25, 'bad');
  City.blackout();
  fxFlash('bad');
  shake();
  if (r.mode !== 'flash') setNote('');
  if (pen) floater('−' + pen.toFixed(1), 'bad');
}

function startRound() {
  const r = run, [dg, n0, s0] = FLASH[r.level];
  const n = n0 + Math.ceil(r.round / 2), s = Math.max(.22, s0 * Math.pow(.9, Math.floor(r.round / 2)));
  const seq = [];
  let prev = 0;
  for (let i = 0; i < n; i++) { let v; do { v = dg === 1 ? randi(1, 9) : randi(10, 99); } while (v === prev); seq.push(v); prev = v; }
  r.seq = seq; r.sum = seq.reduce((a, b) => a + b, 0);
  r.fi = -1; r.fOn = false; r.fShow = s * .72; r.fGap = s * .28; r.ft = .5;
  r.phase = 'flash'; r.input = '';
  setSign('');
  hideAnswer();
  setNote('');
}
function flashTick(dt) {
  const r = run;
  r.ft -= dt;
  while (r.phase === 'flash' && r.ft <= 0) {
    if (r.fOn) { r.fOn = false; setSign(''); r.ft += r.fGap; continue; }
    r.fi++;
    if (r.fi < r.seq.length) { r.fOn = true; setSign((r.fi ? '+' : '') + r.seq[r.fi], 'fl'); Sfx.blip(); r.ft += r.fShow; }
    else { r.phase = 'ask'; r.t0 = now(); setSign('=', 'ig'); setTyped(''); }
  }
}
function flashJudge(ok, t) {
  const r = run;
  if (ok) {
    r.right++; r.score++; r.round++; r.streak++; r.top = Math.max(r.top, r.streak); r.times.push(t); meta.solved++;
    good(r, 0);
    r.phase = 'wait'; r.wait = .75;
  } else {
    r.lives--; r.streak = 0;
    r.misses.push({ text: r.seq.join(' + '), ans: r.sum });
    r.phase = 'reveal'; r.rv = 1.7; r.swapped = false;
    bad(r, 0);
    setNote(esc(r.seq.join(' + ')), 'seq');
  }
}

function hud(force) {
  const r = run;
  let t = '';
  if (r.mode === 'sprint') t = String(Math.max(0, Math.ceil(r.clock - 1e-6)));
  else if (r.mode === 'survival') t = Math.max(0, r.clock).toFixed(1);
  else if (r.mode === 'zen') { const l = r.times.slice(-10); t = l.length ? (l.reduce((a, b) => a + b, 0) / l.length).toFixed(1) + 's' : ''; }
  else t = 'L' + r.lives;
  if (t !== lastMid || force) {
    lastMid = t;
    if (r.mode === 'flash') el.mid.innerHTML = [0, 1, 2].map(i => `<i class="pip${i < r.lives ? ' on' : ''}"></i>`).join('');
    else el.mid.textContent = t;
  }
  const counting = r.phase === 'count';
  el.mid.classList.toggle('low', !counting && ((r.mode === 'sprint' && r.clock <= 10) || (r.mode === 'survival' && r.clock <= 5)));
  if (!counting && ((r.mode === 'sprint' && r.clock <= 5) || (r.mode === 'survival' && r.clock <= 4))) {
    const s = Math.ceil(r.clock);
    if (s !== r.lastTick && s > 0) { r.lastTick = s; Sfx.tick(); }
  }
  const ahead = r.best > 0 && (r.mode === 'sprint' ? r.score > r.best * (60 - r.clock) / 60 + .5 : r.mode !== 'zen' && r.score > r.best);
  el.score.classList.toggle('ahead', ahead);
}

function end() {
  const r = run;
  if (!r || r.phase === 'end') return;
  if (r.phase === 'reveal' && !r.swapped) setTyped(String(r.mode === 'flash' ? r.sum : r.p.ans), 'rev');
  r.phase = 'end';
  el.mid.classList.remove('low');
  const res = finalize(r);
  Sfx.over();
  City.finale(res.newBest);
  setTimeout(() => { if (run === r) results(res); }, 950);
}
function finalize(r) {
  const acc = r.tries ? r.right / r.tries : 0;
  const avg = r.times.length ? r.times.reduce((a, b) => a + b, 0) / r.times.length : 0;
  let newBest = false, best = 0;
  if (r.mode !== 'zen') {
    const prev = bests[r.key] || 0;
    if (r.score > prev) { bests[r.key] = r.score; newBest = prev > 0; }
    best = bests[r.key] || 0;
    hist[r.key] = (hist[r.key] || []).concat(r.score).slice(-30);
  }
  if (r.tries) {
    const d = day();
    if (meta.days[meta.days.length - 1] !== d) meta.days.push(d);
    if (meta.days.length > 400) meta.days = meta.days.slice(-400);
  }
  saveProgress();
  return { mode: r.mode, score: r.score, tries: r.tries, acc, avg, top: r.top, misses: r.misses, newBest, best, hist: r.mode === 'zen' ? null : hist[r.key] };
}

/* ---------- results ---------- */
function results(res) {
  show('results');
  resultsAt = now();
  const sc = $('#r-score');
  sc.textContent = res.score;
  sc.classList.toggle('gold', res.newBest);
  $('#r-flag').textContent = res.newBest ? 'new best' : res.best > res.score ? `best ${res.best}` : '';
  $('#r-acc').textContent = res.tries ? Math.round(res.acc * 100) + '%' : '–';
  $('#r-avg').textContent = res.avg ? (res.avg < 10 ? res.avg.toFixed(1) : Math.round(res.avg)) + 's' : '–';
  $('#r-streak').textContent = res.top;
  sparkline(res.hist);
  const box = $('#r-miss'), seen = new Set();
  box.innerHTML = '';
  for (const p of res.misses) {
    if (seen.has(p.text) || seen.size >= 8) continue;
    seen.add(p.text);
    const d = document.createElement('div');
    d.innerHTML = `${esc(p.text)} = <b>${p.ans}</b>`;
    box.appendChild(d);
  }
  box.hidden = !seen.size;
  if (res.newBest) setTimeout(() => Sfx.best(), 150);
}
function sparkline(h) {
  const svg = $('#r-spark');
  if (!h || h.length < 2) { svg.hidden = true; return; }
  svg.hidden = false;
  const VW = 300, VH = 56, p = 6, n = h.length, mx = Math.max(...h), mn = Math.min(...h), span = mx - mn || 1;
  const pts = h.map((v, i) => [p + i * (VW - p * 2) / (n - 1), mx === mn ? VH / 2 : VH - p - (v - mn) / span * (VH - p * 2)].map(v => +v.toFixed(1)));
  const line = pts.map(q => q.join(',')).join(' ');
  const area = `M${pts[0][0]},${VH} ` + pts.map(q => `L${q[0]},${q[1]}`).join(' ') + ` L${pts[n - 1][0]},${VH} Z`;
  const bi = h.lastIndexOf(mx), [lx, ly] = pts[n - 1];
  svg.innerHTML = `<defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22eeff" stop-opacity=".26"/><stop offset="1" stop-color="#22eeff" stop-opacity="0"/></linearGradient></defs>`
    + `<path d="${area}" fill="url(#spg)"/>`
    + `<polyline points="${line}" fill="none" stroke="#22eeff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`
    + (bi !== n - 1 ? `<circle cx="${pts[bi][0]}" cy="${pts[bi][1]}" r="2.6" fill="#ffb547"/>` : '')
    + `<circle cx="${lx}" cy="${ly}" r="4" fill="#ff2e97"/>`;
}

/* ---------- stats ---------- */
// red = needs work, amber = getting there, cyan = solid; brighter toward the top of each tier
function towerRGB(m) {
  const [col, lo, hi] = m < .4 ? [[255, 53, 72], 0, .4] : m < .75 ? [[255, 181, 71], .4, .75] : [[140, 246, 255], .75, 1];
  const k = .45 + .55 * (m - lo) / (hi - lo), glass = [20, 16, 38];
  return col.map((v, j) => Math.round(glass[j] + (v - glass[j]) * k));
}
function dayStreak() {
  const set = new Set(meta.days), d = new Date();
  if (!set.has(day(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(day(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function openStats() {
  const t = $('#tower'), frag = document.createDocumentFragment();
  const cell = (cls, txt) => { const d = document.createElement('div'); d.className = cls; if (txt != null) d.textContent = txt; frag.appendChild(d); return d; };
  cell('h', '×');
  for (let c = 2; c <= 12; c++) cell('h', c);
  for (let r = 2; r <= 12; r++) {
    cell('h', r);
    for (let c = 2; c <= 12; c++) {
      const d = cell('c'), m = mastery(facts[`m:${Math.min(r, c)},${Math.max(r, c)}`]);
      d.dataset.r = r; d.dataset.c = c;
      if (m != null) {
        const rgb = towerRGB(m).join(',');
        d.classList.add('seen');
        d.style.background = `rgb(${rgb})`;
        if (m >= .75) d.style.boxShadow = `0 0 10px rgba(${rgb},.55)`;
      }
    }
  }
  t.innerHTML = '';
  t.appendChild(frag);
  $('#st-read').innerHTML = '';
  $('#t-solved').textContent = meta.solved.toLocaleString();
  $('#t-days').textContent = dayStreak();
  show('stats');
}
function readCell(d) {
  if (!d || !d.classList.contains('c')) return;
  $$('#tower .sel').forEach(x => x.classList.remove('sel'));
  d.classList.add('sel');
  const r = +d.dataset.r, c = +d.dataset.c, f = facts[`m:${Math.min(r, c)},${Math.max(r, c)}`];
  $('#st-read').innerHTML = `${r} × ${c} = ${r * c}` + (f && f.n ? `<span>${f.t ? f.t.toFixed(1) + 's' : '–'}</span><span>${f.c}/${f.n}</span>` : '');
}

/* ---------- menu ---------- */
function renderMenu() {
  for (const b of $$('.modes button')) { const on = b.dataset.mode === settings.mode; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); }
  for (const b of $$('.ops button')) { const on = settings.ops.includes(b.dataset.op); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }
  for (const b of $$('.levels button')) { const l = +b.dataset.level; b.classList.toggle('on', l <= settings.level); b.setAttribute('aria-checked', l === settings.level); }
  $('.ops').classList.toggle('off', settings.mode === 'flash');
  const best = settings.mode === 'zen' ? 0 : bests[cfgKey()] || 0, be = $('#best');
  be.style.visibility = best ? '' : 'hidden';
  be.querySelector('b').textContent = best;
  $('#b-sound').classList.toggle('muted', !settings.sound);
  $('#b-sound').setAttribute('aria-pressed', settings.sound);
}
function setMode(m) { settings.mode = m; saveSettings(); renderMenu(); Sfx.unlock(); Sfx.ui(); }
function setLevel(l) { l = clamp(l, 1, 4); if (l === settings.level) return; settings.level = l; saveSettings(); renderMenu(); Sfx.unlock(); Sfx.ui(); }
function toMenu(fromGame = true) {
  run = null;
  show('menu');
  renderMenu();
  if (!fromGame) return;
  City.ambient();
  Sfx.up();
}
const blurIfMouse = (e, b) => { if (e.detail) b.blur(); };
for (const b of $$('.modes button')) b.addEventListener('click', e => { setMode(b.dataset.mode); blurIfMouse(e, b); });
for (const b of $$('.levels button')) b.addEventListener('click', e => { setLevel(+b.dataset.level); blurIfMouse(e, b); });
for (const b of $$('.ops button')) b.addEventListener('click', e => {
  const o = b.dataset.op, on = settings.ops.includes(o);
  blurIfMouse(e, b);
  if (on && settings.ops.length === 1) { b.classList.remove('nope'); reflow(b); b.classList.add('nope'); return; }
  settings.ops = Object.keys(OPS).filter(x => x === o ? !on : settings.ops.includes(x));
  saveSettings(); renderMenu(); Sfx.unlock(); Sfx.ui();
});
$('#b-go').addEventListener('click', () => Game.start());
$('#b-again').addEventListener('click', () => Game.start());
$('#b-menu').addEventListener('click', () => toMenu());
$('#b-quit').addEventListener('click', () => Game.quit());
$('#b-stats').addEventListener('click', e => { Sfx.unlock(); Sfx.ui(); openStats(); blurIfMouse(e, e.currentTarget); });
$('#b-back').addEventListener('click', () => toMenu(false));
$('#b-sound').addEventListener('click', e => { settings.sound = !settings.sound; saveSettings(); renderMenu(); Sfx.unlock(); Sfx.ui(); blurIfMouse(e, e.currentTarget); });
$('#tower').addEventListener('pointerover', e => readCell(e.target.closest('.c')));
$('#tower').addEventListener('pointerdown', e => readCell(e.target.closest('.c')));

$('#pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b) return;
  e.preventDefault();
  b.classList.add('down');
  setTimeout(() => b.classList.remove('down'), 110);
  Sfx.unlock(); Sfx.key();
  if (b.dataset.k === 'del') Game.back(); else Game.digit(b.dataset.k);
});

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  Sfx.unlock();
  if (screen === 'play') {
    if (k.length === 1 && k >= '0' && k <= '9') {
      e.preventDefault();
      if (!e.repeat) { if (COARSE.matches) document.body.classList.add('kbd'); Game.digit(k); }
    } else if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); Game.back(); }
    else if (k === 'Enter') { e.preventDefault(); Game.submit(); }
    else if (k === 'Escape') { e.preventDefault(); Game.quit(); }
    return;
  }
  if (screen === 'menu') {
    if ((k === 'Enter' || k === ' ') && !onButton) { e.preventDefault(); Game.start(); }
    else if (k === 'ArrowRight' || k === 'ArrowLeft') { e.preventDefault(); setMode(MODES[(MODES.indexOf(settings.mode) + (k === 'ArrowRight' ? 1 : 3)) % 4]); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); setLevel(settings.level + (k === 'ArrowUp' ? 1 : -1)); }
    return;
  }
  if (screen === 'results') {
    if (now() - resultsAt < 500) return;
    if ((k === 'Enter' || k === ' ') && !onButton) { e.preventDefault(); Game.start(); }
    else if (k === 'Escape') { e.preventDefault(); toMenu(); }
    return;
  }
  if (screen === 'stats' && (k === 'Escape' || k === 'Backspace')) { e.preventDefault(); toMenu(false); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { Game.pause(); saveProgress(); } else Game.resume(); });
addEventListener('blur', () => Game.pause());
addEventListener('focus', () => Game.resume());
addEventListener('pagehide', saveProgress);
document.addEventListener('gesturestart', e => e.preventDefault());
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { City.build(); fit(); }, 120); });

/* ---------- boot ---------- */
let last = 0;
function frame(ts) {
  const dt = last ? (ts - last) / 1000 : 0;
  last = ts;
  City.update(Math.min(dt, .05));
  Game.tick(Math.min(dt, .25));
  City.draw();
  requestAnimationFrame(frame);
}
function boot() {
  City.build();
  renderMenu();
  fit();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('900 32px "Zen Maru Gothic"', '暗算ラーメン'),
      document.fonts.load('40px "Tilt Neon"', '0123456789+−×÷='),
      document.fonts.load('600 22px "Martian Mono"', '0123456789'),
    ]).then(() => { City.refresh(); fit(); }).catch(() => {});
  }
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(() => boot());
else boot();
})();
</script>
