<!DOCTYPE html>
<html lang="en">
<head>
<!--site:start-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Quick Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=Tilt+Neon&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&text=暗算ラーメンカオケ電脳ホテル薬酒場夜市ゲム寿司未来喫茶占い進歩塔問題間違記録練習計&display=swap">
<style>
:root {
  color-scheme: dark;
  --night: #07050e;
  --ink: #ece6ff;
  --dim: #7a70a3;
  --mute: #3a3160;
  --pink: #ff2e97;
  --pink-core: #ffe4f2;
  --cyan: #22eeff;
  --cyan-core: #e4fdff;
  --amber: #ffb547;
  --amber-core: #fff1da;
  --fault: #ff3548;
  --display: "Tilt Neon", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --glow-pink: 0 0 .03em #fff, 0 0 .1em var(--pink), 0 0 .26em var(--pink), 0 0 .6em rgba(255, 46, 151, .5);
  --glow-cyan: 0 0 .03em #fff, 0 0 .1em var(--cyan), 0 0 .26em var(--cyan), 0 0 .55em rgba(34, 238, 255, .45);
  --glow-amber: 0 0 .03em #fff, 0 0 .1em var(--amber), 0 0 .26em var(--amber), 0 0 .55em rgba(255, 181, 71, .45);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font: 400 13px/1.4 var(--mono);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
[hidden] { display: none !important; }
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 4px; }

#city { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
#fx i { position: absolute; inset: 0; opacity: 0; }
#fx .ok { box-shadow: inset 0 0 140px rgba(34, 238, 255, .28); }
#fx .bad {
  background: repeating-linear-gradient(0deg, rgba(255, 53, 72, .09) 0 2px, transparent 2px 4px), rgba(255, 20, 60, .08);
  box-shadow: inset 0 0 180px rgba(255, 53, 72, .45);
}
#fx i.run { animation: fxflash .34s ease-out; }
@keyframes fxflash { 0% { opacity: 0 } 12% { opacity: 1 } 100% { opacity: 0 } }

.screen {
  position: fixed;
  inset: 0;
  z-index: 2;
  padding: calc(var(--st) + 10px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);
}
.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse 60% 48% at 50% 42%, rgba(6, 4, 12, .5), rgba(6, 4, 12, 0) 72%);
}
#results::before { background: radial-gradient(ellipse 64% 56% at 50% 46%, rgba(6, 4, 12, .78), rgba(6, 4, 12, 0) 76%), rgba(6, 4, 12, .25); }
#stats::before { background: radial-gradient(ellipse 64% 56% at 50% 46%, rgba(6, 4, 12, .7), rgba(6, 4, 12, 0) 76%), rgba(6, 4, 12, .5); }
.icon { width: 44px; height: 44px; display: grid; place-items: center; color: var(--dim); transition: color .15s; }
.icon:hover { color: var(--ink); }
.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- menu ---------- */
#menu { display: grid; place-items: center; }
.corner { position: absolute; top: calc(var(--st) + 6px); right: calc(var(--sr) + 8px); display: flex; }
#b-sound .s-off, #b-sound.muted .s-on { display: none; }
#b-sound.muted .s-off { display: block; }
.menu-core { display: grid; justify-items: center; gap: clamp(16px, 3.3vh, 30px); transform: translateY(-6vh); }
.menu-core > *, .res > * { animation: boot .7s linear both; animation-delay: calc(var(--i, 0) * 75ms); }
@keyframes boot { 0% { opacity: 0 } 10% { opacity: .85 } 16% { opacity: .1 } 28% { opacity: 1 } 36% { opacity: .3 } 50%, 100% { opacity: 1 } }
.modes { display: flex; gap: clamp(10px, 3.6vw, 34px); }
.modes button {
  font: 600 clamp(12px, .45vw + 7px, 15px)/1 var(--mono);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--dim);
  padding: 12px 2px;
  transition: color .15s, text-shadow .15s;
}
.modes button:hover { color: var(--ink); }
.modes button.on { color: var(--cyan-core); text-shadow: 0 0 6px var(--cyan), 0 0 16px rgba(34, 238, 255, .6); }
.ops { display: flex; gap: clamp(8px, 2.6vw, 20px); }
.ops.off { visibility: hidden; }
.ops button {
  width: clamp(56px, 4.4vw, 72px);
  height: clamp(56px, 4.4vw, 72px);
  display: grid;
  place-items: center;
  font: clamp(40px, 3.1vw, 52px)/1 var(--display);
  color: var(--mute);
  transition: color .15s, text-shadow .15s;
}
.ops button:hover { color: var(--dim); }
.ops button.on { color: var(--cyan-core); text-shadow: var(--glow-cyan); }
.ops button.nope { animation: nope .3s; }
@keyframes nope { 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
.levels { display: flex; align-items: flex-end; height: clamp(44px, 3.4vw, 54px); }
.levels button { width: 26px; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.levels i { display: block; width: 8px; height: calc(var(--h) * 1%); border: 1px solid var(--mute); transition: background .15s, box-shadow .15s, border-color .15s; }
.levels button:hover i { border-color: var(--dim); }
.levels button.on i { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan), 0 0 18px rgba(34, 238, 255, .45); }
.go {
  font: clamp(30px, 2.3vw, 38px)/1 var(--display);
  letter-spacing: .06em;
  color: var(--pink-core);
  padding: 15px 44px 17px;
  border: 2px solid var(--pink);
  border-radius: 7px;
  text-shadow: 0 0 .1em var(--pink), 0 0 .3em var(--pink);
  box-shadow: 0 0 10px var(--pink), 0 0 32px rgba(255, 46, 151, .35), inset 0 0 12px rgba(255, 46, 151, .45);
  transition: transform .12s, box-shadow .15s;
}
.go:hover { box-shadow: 0 0 14px var(--pink), 0 0 44px rgba(255, 46, 151, .5), inset 0 0 16px rgba(255, 46, 151, .6); }
.go:active { transform: scale(.97); }
.best { font: 400 clamp(11px, .75vw, 13px)/1 var(--mono); letter-spacing: .2em; color: var(--amber); }
.best b { font-weight: 600; letter-spacing: .08em; text-shadow: 0 0 10px rgba(255, 181, 71, .6); }

/* ---------- play ---------- */
#play { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "hud" "arena" "pad"; }
.hud { grid-area: hud; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.hud .icon { margin-left: -10px; }
.hud-mid {
  font: 600 clamp(22px, 1.8vw, 28px)/1 var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: .04em;
  text-align: center;
  min-width: 4ch;
  transition: color .2s;
}
.hud-mid.low { color: var(--fault); text-shadow: 0 0 12px rgba(255, 53, 72, .8); }
.pip { display: inline-block; width: 9px; height: 9px; margin: 0 5px; border-radius: 50%; border: 1px solid var(--mute); vertical-align: middle; }
.pip.on { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 8px var(--pink); }
.hud-score {
  justify-self: end;
  font: 600 clamp(22px, 1.8vw, 28px)/1 var(--mono);
  font-variant-numeric: tabular-nums;
  transform-origin: 100% 50%;
  transition: color .3s, text-shadow .3s;
}
.hud-score.ahead { color: var(--cyan-core); text-shadow: 0 0 10px var(--cyan); }
.pop { animation: pop .2s ease-out; }
@keyframes pop { 40% { transform: scale(1.22) } }
.arena {
  grid-area: arena;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .12em;
  min-height: 0;
  padding-bottom: 12vh;
}
.sign { font: 96px/1 var(--display); color: var(--pink-core); text-shadow: var(--glow-pink); white-space: nowrap; min-height: 1em; }
.sign.ig { animation: ig .16s linear; }
.sign.fl { animation: fl .07s ease-out; }
.sign.short { animation: short .5s linear; }
@keyframes ig { 0% { opacity: .2 } 30% { opacity: 1 } 45% { opacity: .55 } 60% { opacity: 1 } }
@keyframes fl { from { opacity: .25 } }
@keyframes short { 0% { opacity: 1 } 8% { opacity: .2 } 14% { opacity: 1 } 22% { opacity: .35 } 30% { opacity: .9 } 44% { opacity: .15 } 52%, 100% { opacity: 1 } }
.answer {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 1.1em;
  font: 86px/1 var(--display);
  color: var(--cyan-core);
  text-shadow: var(--glow-cyan);
  white-space: nowrap;
}
.answer.off { visibility: hidden; }
.caret {
  display: block;
  width: .07em;
  height: .78em;
  margin-left: .07em;
  background: var(--cyan);
  box-shadow: 0 0 .12em var(--cyan), 0 0 .3em rgba(34, 238, 255, .6);
  animation: blink 1.05s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0 } }
.answer.bad, .answer.rev { justify-content: center; }
.answer.bad .caret, .answer.rev .caret, .paused .caret { display: none; }
.answer.bad {
  color: #ffd9dd;
  text-shadow: -.05em 0 rgba(34, 238, 255, .7), .05em 0 rgba(255, 53, 72, .9), 0 0 .3em rgba(255, 53, 72, .8);
  animation: glitch .3s steps(2);
}
@keyframes glitch {
  20% { transform: translate(-.05em, .01em) skewX(-9deg) }
  40% { transform: translate(.05em, -.01em) skewX(7deg) }
  60% { transform: translate(-.03em, 0) }
  80% { transform: translate(.02em, 0) skewX(-3deg) }
}
.answer.rev { color: var(--amber-core); text-shadow: var(--glow-amber); }
.note { min-height: 26px; font: 400 clamp(11px, .8vw, 13px)/1 var(--mono); letter-spacing: .16em; color: var(--pink); display: flex; align-items: center; gap: 8px; text-align: center; max-width: 100%; }
.note b { font: clamp(22px, 1.8vw, 28px)/1 var(--display); letter-spacing: 0; color: var(--pink-core); text-shadow: var(--glow-pink); }
.note.seq { color: var(--amber); letter-spacing: .06em; font-size: 13px; line-height: 1.5; white-space: normal; justify-content: center; }
.paused .arena { opacity: .3; }
.pad { grid-area: pad; display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100%, 420px); justify-self: center; padding-top: 8px; touch-action: none; }
.pad button {
  height: clamp(50px, 8vh, 70px);
  display: grid;
  place-items: center;
  border: 1px solid rgba(125, 105, 200, .28);
  border-radius: 8px;
  background: rgba(12, 8, 26, .6);
  font: 30px/1 var(--display);
  color: var(--cyan-core);
  text-shadow: 0 0 .15em rgba(34, 238, 255, .7);
  transition: background .14s, border-color .14s, box-shadow .14s;
  touch-action: none;
}
.pad button svg { width: 26px; height: 26px; fill: none; stroke: var(--cyan-core); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(34, 238, 255, .7)); }
.pad button.down { background: rgba(34, 238, 255, .2); border-color: var(--cyan); box-shadow: 0 0 16px rgba(34, 238, 255, .35); transition: none; }
.pad .blank { visibility: hidden; }
@media (pointer: coarse) {
  .pad { display: grid; }
  .arena { padding-bottom: 0; }
}
body.kbd .pad { display: none; }
@media (pointer: coarse) and (orientation: landscape) and (max-height: 540px) {
  #play { grid-template-columns: minmax(0, 1fr) minmax(220px, 40%); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "hud hud" "arena pad"; column-gap: 16px; }
  .pad { align-self: center; padding-top: 0; }
  .pad button { height: clamp(40px, 17vh, 60px); }
}

.echo {
  position: fixed;
  z-index: 3;
  pointer-events: none;
  font-family: var(--display);
  line-height: 1;
  color: var(--cyan-core);
  text-shadow: var(--glow-cyan);
  transform: translate(-50%, -50%);
  animation: echo .34s ease-out forwards;
}
@keyframes echo { to { transform: translate(-50%, -50%) scale(1.35); opacity: 0; } }
.float { position: fixed; z-index: 3; pointer-events: none; font: 600 13px/1 var(--mono); transform: translate(-50%, 0); animation: floatup .8s ease-out forwards; }
.float.ok { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
.float.bad { color: var(--fault); text-shadow: 0 0 8px var(--fault); }
@keyframes floatup { to { transform: translate(-50%, -28px); opacity: 0; } }
.shake { animation: shake .26s linear; }
@keyframes shake { 20% { transform: translate(-6px, 2px) } 40% { transform: translate(5px, -2px) } 60% { transform: translate(-3px, 1px) } 80% { transform: translate(2px, 0) } }

/* ---------- results ---------- */
#results { display: grid; place-items: center; overflow-y: auto; }
.res { display: grid; justify-items: center; gap: 16px; width: min(100%, 520px); transform: translateY(-3vh); }
.r-score { font: clamp(96px, 24vw, 176px)/.9 var(--display); color: var(--pink-core); text-shadow: var(--glow-pink); }
.r-score.gold { color: var(--amber-core); text-shadow: var(--glow-amber); }
.r-flag { min-height: 11px; font: 600 11px/1 var(--mono); letter-spacing: .3em; color: var(--amber); }
.r-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; padding-top: 6px; }
.r-stats div { display: grid; justify-items: center; gap: 8px; }
.r-stats b { font: 400 clamp(30px, 2.4vw, 38px)/1 var(--display); color: var(--cyan-core); text-shadow: 0 0 .1em var(--cyan), 0 0 .3em rgba(34, 238, 255, .5); }
.r-stats span { font: 400 clamp(10px, .7vw, 12px)/1 var(--mono); letter-spacing: .14em; color: var(--dim); }
.r-spark { width: min(100%, 300px); aspect-ratio: 300 / 56; overflow: visible; }
.r-miss { display: grid; grid-template-columns: repeat(2, auto); gap: 8px 30px; font: 400 clamp(13px, .9vw, 15px)/1.2 var(--mono); color: #ff8d98; }
.r-miss b { color: var(--amber); font-weight: 600; }
.r-miss s { color: var(--fault); opacity: .85; margin-left: 6px; }
.r-actions { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
.ghost { font: 600 12px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--dim); padding: 18px 18px; transition: color .15s; }
.ghost:hover { color: var(--ink); }

/* ---------- tower view ---------- */
#stats { padding: 0; }
#stats::before { background: radial-gradient(ellipse 70% 50% at 50% 30%, rgba(6, 4, 12, .3), rgba(6, 4, 12, 0) 80%), rgba(6, 4, 12, .86); }
.st { height: 100%; display: flex; flex-direction: column; }
.st-top {
  display: flex;
  align-items: flex-start;
  gap: 0 12px;
  padding: calc(var(--st) + 2px) calc(var(--sr) + 16px) 2px calc(var(--sl) + 6px);
  background: rgba(7, 5, 14, .88);
  border-bottom: 1px solid #1c1534;
}
.st-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px; flex: 1; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 0 14px; }
.seg button { font: 600 11px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--dim); padding: 12px 1px; transition: color .15s, text-shadow .15s; }
.seg button:hover { color: var(--ink); }
.seg button.on { color: var(--cyan-core); text-shadow: 0 0 6px var(--cyan), 0 0 14px rgba(34, 238, 255, .5); }
.seg button:disabled { opacity: .35; cursor: default; }
.seg[data-set="tab"] button, .seg[data-set="pop"] button:not([data-v="all"]) { font: 400 24px/1 var(--display); letter-spacing: 0; padding: 6px 5px; color: var(--mute); }
.seg[data-set="tab"] button:hover, .seg[data-set="pop"] button:not([data-v="all"]):hover { color: var(--dim); }
.seg[data-set="tab"] button.on, .seg[data-set="pop"] button.on:not([data-v="all"]) { color: var(--cyan-core); text-shadow: var(--glow-cyan); }
.lv { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; vertical-align: middle; }
.lv i { display: block; width: 4px; border: 1px solid currentColor; opacity: .5; }
.lv i.f { background: currentColor; opacity: 1; }
.seg button.on .lv i.f { box-shadow: 0 0 6px var(--cyan); }
.st-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 28px calc(var(--sr) + 16px) calc(var(--sb) + 56px) calc(var(--sl) + 16px); }
.st-wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px 60px; }
@media (min-width: 900px) { .st-wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span2 { grid-column: 1 / -1; } }
.sec { display: grid; gap: 16px; align-content: start; min-width: 0; }
.sec-h { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 12px; min-height: 36px; }
.sec-h h2 { margin: 0; font: 400 27px/1 var(--display); color: var(--pink-core); text-shadow: 0 0 .08em var(--pink), 0 0 .3em rgba(255, 46, 151, .5); }
.sec-h .jp { font: 900 15px/1 "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; color: #6f60a3; letter-spacing: .08em; }
.sec-h .seg { margin-left: auto; }
.sec-h .seg + .seg { margin-left: 0; }
.empty, .note-line { margin: 0; font: 400 12px/1.6 var(--mono); color: var(--dim); }
.note-line b { color: var(--ink); font-weight: 600; }
.muted { color: var(--dim); }

.hero { display: grid; grid-template-columns: 1.35fr repeat(4, minmax(0, 1fr)); gap: 24px; align-items: start; }
@media (max-width: 760px) { .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 18px; } .hero .streak { grid-column: 1 / -1; } }
.stat { display: grid; gap: 9px; align-content: start; min-width: 0; }
.stat b { font: 400 clamp(38px, 4.4vw, 56px)/1 var(--display); color: var(--cyan-core); text-shadow: 0 0 .05em #fff, 0 0 .16em var(--cyan), 0 0 .42em rgba(34, 238, 255, .4); white-space: nowrap; }
.stat span { font: 400 11px/1.3 var(--mono); letter-spacing: .12em; color: var(--dim); }
.stat.streak b { color: var(--pink-core); text-shadow: var(--glow-pink); }
.week { display: flex; gap: 6px; padding-top: 4px; }
.week i { display: grid; justify-items: center; gap: 5px; font: 400 9px/1 var(--mono); font-style: normal; color: var(--dim); }
.week i::before { content: ""; width: 18px; height: 22px; background: #151027; border: 1px solid #261e46; }
.week i.on::before { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 9px rgba(255, 46, 151, .7); }
.week i.today { color: var(--ink); }
.week i.today:not(.on)::before { border-color: var(--pink); }

.prog-sum { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 30px; }
.prog-sum > div { display: grid; gap: 8px; }
.prog-sum span { font: 400 11px/1 var(--mono); letter-spacing: .12em; color: var(--dim); }
.prog-sum strong { font: 400 28px/1 var(--display); color: var(--ink); font-weight: 400; white-space: nowrap; }
.prog-sum strong em { font-style: normal; color: var(--mute); margin: 0 .3em; }
.prog-sum .arrow { font: 400 26px/1 var(--display); color: var(--dim); align-self: center; }
.prog-sum .delta { font: 400 13px/1.2 var(--mono); color: var(--ink); gap: 8px; }
.up::before { content: "▲ "; color: var(--cyan); }
.down::before { content: "▼ "; color: var(--fault); }
.flat::before { content: "● "; color: var(--dim); }
.chart { position: relative; min-height: 190px; }
.chart svg { display: block; width: 100%; height: 200px; overflow: visible; touch-action: pan-y; }
.chart text { font: 400 10px var(--mono); fill: var(--dim); }
.chart .gl { stroke: #1f1839; stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--cyan); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const now = () => performance.now();
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const COARSE = matchMedia('(pointer: coarse)');
const reflow = el => void el.offsetWidth;

/* ---------- saved state ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('qm1:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('qm1:' + k, JSON.stringify(v)); } catch (e) {} },
};
const OPS = { add: '+', sub: '−', mul: '×', div: '÷' };
const MODES = ['sprint', 'survival', 'flash', 'zen'];
const settings = Object.assign({ mode: 'sprint', ops: Object.keys(OPS), level: 2, sound: true }, store.get('settings', {}));
if (!MODES.includes(settings.mode)) settings.mode = 'sprint';
settings.ops = Object.keys(OPS).filter(o => Array.isArray(settings.ops) && settings.ops.includes(o));
if (!settings.ops.length) settings.ops = Object.keys(OPS);
settings.level = clamp(Math.round(settings.level) || 2, 1, 4);
// The first version kept only running totals in localStorage. Those stay as a read-only baseline;
// every answer and game since is appended to a log in IndexedDB, and all stats come from that log.
const legacy = {
  bests: store.get('bests', {}), hist: store.get('hist', {}), facts: store.get('facts', {}),
  meta: Object.assign({ solved: 0, days: [] }, store.get('meta', {})),
};
const saveLegacy = () => { for (const k of ['bests', 'hist', 'facts', 'meta']) store.set(k, legacy[k]); };
const facts = {};
const LOG = [], RUNS = [];
const saveSettings = () => store.set('settings', settings);
const cfgKey = () => settings.mode === 'flash' ? `flash:${settings.level}` : `${settings.mode}:${settings.level}:${settings.ops.join('')}`;
const day = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

/* ---------- problems ---------- */
// sub and div are served as the inverse of add and mul, so they share ranges and fact families.
const RANGE = {
  1: { add: [[2, 9], [2, 9]], mul: [[2, 9], [2, 9]] },
  2: { add: [[6, 49], [6, 49]], mul: [[2, 12], [2, 12]] },
  3: { add: [[12, 99], [12, 99]], mul: [[3, 12], [12, 99]] },
  4: { add: [[101, 999], [12, 999]], mul: [[11, 25], [11, 25]] },
};
const baseOp = op => op === 'sub' ? 'add' : op === 'div' ? 'mul' : op;
function fam(op, a, b) {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  if (baseOp(op) === 'mul' && hi <= 12) return `m:${lo},${hi}`;
  if (baseOp(op) === 'add' && hi <= 9) return `a:${lo},${hi}`;
  return null;
}
function make(op, a, b) {
  const sw = Math.random() < .5, key = fam(op, a, b);
  const [x, y, ans] = op === 'add' ? [sw ? a : b, sw ? b : a, a + b] : op === 'sub' ? [a + b, a, b]
    : op === 'mul' ? [sw ? a : b, sw ? b : a, a * b] : [a * b, a, b];
  return { op, x, y, ans, key, text: `${x} ${OPS[op]} ${y}` };
}
function genPlain(level, ops, prev) {
  let p;
  for (let i = 0; i < 8; i++) {
    const op = pick(ops), [[a0, a1], [b0, b1]] = RANGE[level][baseOp(op)];
    p = make(op, randi(a0, a1), randi(b0, b1));
    if (p.text !== prev) break;
  }
  return p;
}
// Zen leans toward facts you miss or answer slowly.
function weight(f) {
  if (!f || !f.n) return 2;
  const slow = f.t ? clamp((f.t - 1.2) / 1.3, 0, 1.5) : 1;

let screen = 'menu', baseFS = 96, resultsAt = 0;
function show(name) {

}

/* ---------- game ---------- */
const CD = .42;

const survBonus = r => Math.round(SURV[r.level] * Math.max(.55, 2.6 - .035 * (r.right - 1)) * 10) / 10;

let run = null, lastMid = '';

const Game = {
  start() {
    Sfx.unlock(); Haptic.init(); Sfx.down();

      mode: settings.mode, level: settings.level, ops: settings.ops.slice(), key: cfgKey(), best: bestFor(cfgKey()), id: Date.now(), active: 0,

      score: 0, streak: 0, top: 0, tries: 0, right: 0, times: [], misses: [], retry: [],

      lives: 3, round: 0, p: null, input: '', t0: 0, rv: 0, swapped: false,

    el.score.classList.remove('ahead');

  digit(d) {

    const target = String(r.mode === 'flash' ? r.sum : r.p.ans);
    if (r.input.length >= target.length) judge(r.input === target);
  },
  back() {
    const r = run;

    setTyped(r.input);
  },
  submit() {
    const r = run;

  },
  quit() {
    const r = run;
    if (!r || r.phase === 'end') return;

    toMenu();
  },
  pause() {

  resume() {

      <div class="stat streak"><b>${streak}</b><span>day streak${longest > streak ? ` · best ${longest}` : ''}</span><div class="week">${week}</div></div>
      <div class="stat"><b>${ok.length.toLocaleString()}</b><span>solved</span></div>
      <div class="stat"><b>${A.length ? pct(ok.length / A.length) : '–'}</b><span>accuracy</span></div>

  }

  function secProgress() {
    const D = byDay(A), scored = ['sprint', 'survival', 'flash'].includes(V.mode);
    if (V.chart === 'score' && !scored) V.chart = 'speed';
    const tabs = seg('chart', [['speed', 'Speed'], ['accuracy', 'Accuracy'], ['score', 'Score', !scored]], V.chart);
    let top = '';
    if (!A.length) top = `<p class="empty">Nothing here yet for these filters. Play a round and it shows up.</p>`;
    else if (D.length < 2) top = `<p class="note-line">One day of data so far. Play again tomorrow to see your trend.</p>`;
    else {
      const k = Math.min(3, Math.floor(D.length / 2)), a = sum(D.slice(0, k).flatMap(d => d.list)), b = sum(D.slice(-k).flatMap(d => d.list));
      const label = n => n === 1 ? 'day' : `${n} days`;

  }

  function towerCells() {
    const t = V.tab, dig = t === '+' || t === '−', lo = dig ? 0 : 2, hi = dig ? 9 : V.size, cells = new Map();
    const put = (r, c, e) => {
      if (r < lo || c < lo || r > hi || c > hi) return;
      const k = r + ',' + c;
      let l = cells.get(k);
      if (!l) cells.set(k, l = []);
      l.push(e);
    };
    for (const e of A) {
      if (e.o !== t) continue;
      if (t === '×') { put(e.x, e.y, e); if (e.x !== e.y) put(e.y, e.x, e); }
      else if (t === '÷') put(e.y, e.a, e);
      else if (t === '+') { const a = e.x % 10, b = e.y % 10; put(a, b, e); if (a !== b) put(b, a, e); }
      else put(e.x % 10, e.y % 10, e);
    }
    return { cells, lo, hi };
  }
  function secTower() {
    const { cells, lo, hi } = towerCells(), t = V.tab, sym = t === '×' || t === '+';
    const useLegacy = t === '×' && V.mode === 'all' && V.level === 'all' && V.range === 'all';
    const grades = new Map(), counts = [0, 0, 0, 0];
    const n = hi - lo + 2, avail = innerWidth >= 820 ? Math.min(colW(true) * .6, 600) : colW(true);
    const c = clamp(Math.floor((avail - 24 - (n - 1) * 3) / n), 11, 34);
    let grid = `<div class="h op">${t}</div>`;
    for (let x = lo; x <= hi; x++) grid += `<div class="h">${x}</div>`;
    for (let r = lo; r <= hi; r++) {
      grid += `<div class="h">${r}</div>`;
      for (let col = lo; col <= hi; col++) {
        const k = r + ',' + col, list = cells.get(k), g = list ? grade(list) : useLegacy ? legacyGrade(r, col) : null;
        if (g) grades.set(k, g);
        if (!sym || r <= col) counts[g ? g.tier : 0]++;
        grid += `<i class="c t${g ? g.tier : 0}" data-k="${k}" role="button" tabindex="-1" aria-label="${esc(cellTitle(r, col))}"></i>`;
      }
    }
    TW = { cells, grades };
    picked = null;
    // open on the shakiest square with the most tries, so there's always something to look at
    let pickK = null, pickN = -1;
    for (const [k, g] of grades) { const w = (g.tier === 1 ? 1e6 : g.tier === 2 ? 1e3 : 0) + (cells.get(k) || []).length; if (g.tier < 3 && w > pickN) { pickN = w; pickK = k; } }
    picked = pickK;
    const tg = TARGET[t].map((v, i) => `L${i + 1} ${secs(v)}`).join(' · ');
    const note = t === '+' ? 'Squares are last digits: 47 + 38 lands on 7 + 8.' : t === '−' ? 'Rows are the last digit of the first number, columns the number taken away: 91 − 38 lands on 1 − 8.' : t === '÷' ? 'Rows are what you divide by, columns the answer: 56 ÷ 8 lands on row 8, column 7.' : '7 × 8 and 8 × 7 share a square.';
    const tabs = seg('tab', [['+', '+'], ['−', '−'], ['×', '×'], ['÷', '÷']], t) + (t === '×' || t === '÷' ? seg('size', [[12, 'to 12'], [25, 'to 25']], V.size) : '');
    return `<section class="sec span2">${head('Tower', '塔', tabs)}
      <div class="tw">
        <div class="tw-grid"><div class="tower-wrap"><i class="mast"></i><div class="tower" id="tower" style="--n:${n};--c:${c}px">${grid}</div></div></div>
        <div class="key">
          <div class="key-row"><i class="t3"></i><b>Locked in</b><em>${counts[3]}</em><small>9 of your last 10 right, at speed</small></div>
          <div class="key-row"><i class="t2"></i><b>Getting there</b><em>${counts[2]}</em><small>3 of 4 right, within twice the target time</small></div>
          <div class="key-row"><i class="t1"></i><b>Shaky</b><em>${counts[1]}</em><small>missed more than 1 in 4, or slower than twice the target</small></div>

  }
  function cellTitle(r, c) {
    const t = V.tab;
    return t === '×' ? `${r} × ${c} = ${r * c}` : t === '÷' ? `${r * c} ÷ ${r} = ${c}` : t === '+' ? `Ends in ${r} + ${c}` : `Ends in ${r} − ${c}${r < c ? ', a borrow' : ''}`;
  }
  function cellInfo(k) {

    if (g.legacy) return `<h3>${esc(title)}</h3><div class="tier t${g.tier}">${TIER[g.tier]}</div><dl><dt>Right</dt><dd>${g.legacy.c} of ${g.legacy.n}</dd><dt>Speed</dt><dd>${secs(g.legacy.t)} average</dd></dl><p class="note-line">From your first days, before every answer was logged.</p>`;

    let trend = '';
    if (ok.length >= 4) { const h = ok.length >> 1; trend = `${secs(median(ok.slice(0, h).map(e => e.t)))} → ${secs(median(ok.slice(h).map(e => e.t)))}`; }
    const wrong = [...new Map(list.filter(e => !e.ok).reverse().map(e => [e.g, e])).values()].slice(0, 4)
      .map(e => `${esc(e.g)} <span class="why-t">${esc(why(e).t)}</span>`).join('<br>');
    const byP = new Map();
    for (const e of list) { const p = probText(e), v = byP.get(p) || { n: 0, ok: 0 }; v.n++; if (e.ok) v.ok++; byP.set(p, v); }
    const probs = [...byP.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 5).map(([p, v]) => `${esc(p)} <span class="muted">${v.ok}/${v.n}</span>`).join('<br>');
    return `<h3>${esc(title)}</h3><div class="tier t${g.tier}">${TIER[g.tier]}</div><dl>
      <dt>Last tries</dt><dd class="dots">${dots}</dd>
      <dt>Right</dt><dd>${rok.length} of last ${g.recent.length}${list.length > g.recent.length ? ` · ${pct(ok.length / list.length)} of all ${list.length}` : ''}</dd>
      <dt>Speed</dt><dd>${secs(median(rok.map(e => e.t)))} median · target ${secs(target(list[list.length - 1]))}</dd>
      ${trend ? `<dt>Then → now</dt><dd>${trend}</dd>` : ''}
      ${wrong ? `<dt>Typed instead</dt><dd>${wrong}</dd>` : ''}
      <dt>Problems</dt><dd>${probs}</dd></dl>`;
  }

  function problemGroups(list) {
    const m = new Map();
    for (const e of list) {
      const k = e.o === 'Σ' ? 'Σ' + e.s.join(',') : e.o + e.x + ',' + e.y;
      let g = m.get(k);
      if (!g) m.set(k, g = []);
      g.push(e);
    }
    return [...m.values()].map(l => {
      const ok = l.filter(e => e.ok), s = { e: l[l.length - 1], list: l, n: l.length, ok: ok.length, miss: l.length - ok.length, acc: ok.length / l.length,
        med: median(ok.map(e => e.t)), ratio: median(ok.map(e => e.t / target(e))), imp: NaN, tier: grade(l).tier };
      if (ok.length >= 4) { const h = ok.length >> 1; s.from = median(ok.slice(0, h).map(e => e.t)); s.to = median(ok.slice(h).map(e => e.t)); s.imp = (s.from - s.to) / s.from; }
      return s;
    });
  }
  const SORTS = {
    // smoothed miss rate, so a problem missed on several tries outranks a one-off slip
    worst: [s => s.miss > 0, (a, b) => (b.miss + .5) / (b.n + 2) - (a.miss + .5) / (a.n + 2) || b.miss - a.miss],
    slowest: [s => s.ok > 0, (a, b) => b.ratio - a.ratio],
    improved: [s => s.imp > .05, (a, b) => b.imp - a.imp],
    best: [s => s.ok > 1, (a, b) => b.acc - a.acc || a.ratio - b.ratio || b.n - a.n],
    most: [() => true, (a, b) => b.n - a.n || a.acc - b.acc],
  };
  function secProblems() {
    const present = ['+', '−', '×', '÷', 'Σ'].filter(o => A.some(e => e.o === o));
    if (V.pop !== 'all' && !present.includes(V.pop)) V.pop = 'all';
    const [keep, cmp] = SORTS[V.ptab];
    const all = problemGroups(A.filter(e => V.pop === 'all' || e.o === V.pop)).filter(keep).sort(cmp);
    groupsShown = all.slice(0, more ? 40 : 10);
    const imp = V.ptab === 'improved';
    const rows = groupsShown.map((s, i) => `<button class="prow" data-i="${i}" aria-expanded="false">
        <span class="p">${esc(probText(s.e))}<small>= ${s.e.a}</small></span>
        <span class="bar-bg t${s.tier}"><i style="width:${Math.round(s.acc * 100)}%"></i></span>
        <span class="n">${pct(s.acc)}<small>${s.ok}/${s.n}</small></span>
        <span class="n">${imp ? `${secs(s.from)} → ${secs(s.to)}` : secs(s.med)}<small>${imp ? 'then → now' : 'median'}</small></span>
      </button><div class="pdet" id="pd-${i}" hidden></div>`).join('');
    const empty = { worst: 'No misses here. Nothing to fix.', slowest: 'No correct answers here yet.', improved: 'Needs 4+ correct answers on the same problem to show a change.', best: 'Needs 2+ correct answers on the same problem.', most: 'No problems here yet.' }[V.ptab];
    const tabs = seg('ptab', [['worst', 'Worst'], ['slowest', 'Slowest'], ['improved', 'Improved'], ['best', 'Best'], ['most', 'Most done']], V.ptab);

    return `<section class="sec">${head('Problems', '問題')}${tabs}${opSeg}
      ${rows ? `<div class="plist"><div class="phead"><span>Problem</span><span></span><span>Right</span><span>Speed</span></div>${rows}</div>` : `<p class="empty">${empty}</p>`}
      ${all.length > 10 ? `<button class="more" data-act="more">${more ? 'Show fewer' : `Show ${Math.min(40, all.length) - 10} more`}</button>` : ''}</section>`;
  }
  function problemDetail(s) {
    const items = s.list.slice(-14).reverse().map(e => e.ok
      ? `<span><span class="okm">✓</span> ${secs(e.t)} <span class="muted">${ago(e.ts)}</span></span>`
      : `<span><span class="xm">✗</span> typed ${esc(e.g)}, <span class="why-t">${esc(why(e).t)}</span> <span class="muted">${ago(e.ts)}</span></span>`).join('');
    const where = [...new Set(s.list.map(e => `${MODE_NAME[e.m]} L${e.l}`))].join(', ');
    return `<div class="hist">${items}</div><div class="muted">${s.n} ${s.n === 1 ? 'try' : 'tries'} in ${where}</div>`;
  }

  function secMistakes() {
    const M = A.filter(e => !e.ok);
    if (!M.length) return `<section class="sec">${head('Mistakes', '間違い')}<p class="empty">No misses with these filters.</p></section>`;
    const cnt = {};
    for (const e of M) { const k = why(e).k; cnt[k] = (cnt[k] || 0) + 1; }
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 6), max = top[0][1];
    const bars = top.map(([k, v]) => `<div class="why-row"><span>${WHY[k]}</span><span class="bar-bg"><i style="width:${Math.max(3, v / max * 100)}%"></i></span><span class="n">${pct(v / M.length)}<small>${v}</small></span></div>`).join('');
    const recent = M.slice(-12).reverse().map(e => `<div class="mrow"><div class="p">${esc(probText(e))} = <b>${e.a}</b></div>
      <div class="you">typed ${esc(e.g)} · <em>${esc(why(e).t)}</em></div><div class="when">${ago(e.ts)}<br>${MODE_NAME[e.m]} L${e.l}</div></div>`).join('');
    return `<section class="sec">${head('Mistakes', '間違い')}<div class="why">${bars}</div><p class="sub-h">Recent misses</p><div class="mlist">${recent}</div></section>`;
  }

  function insights() {
    const out = [], ok = A.filter(e => e.ok), t = e => e.t;
    const gap = (a, b) => a.length >= 8 && b.length >= 8 ? median(a.map(t)) - median(b.map(t)) : NaN;
    const add = ok.filter(e => e.o === '+'), dCarry = gap(add.filter(e => e.x % 10 + e.y % 10 >= 10), add.filter(e => e.x % 10 + e.y % 10 < 10));
    if (dCarry >= .25) out.push([dCarry, `Carrying adds about <b>${secs(dCarry)}</b> to your addition.`]);
    const sub = ok.filter(e => e.o === '−'), dBorrow = gap(sub.filter(e => e.x % 10 < e.y % 10), sub.filter(e => e.x % 10 >= e.y % 10));
    if (dBorrow >= .25) out.push([dBorrow, `Borrowing adds about <b>${secs(dBorrow)}</b> to your subtraction.`]);
    const dDiv = gap(ok.filter(e => e.o === '÷' && e.l <= 2), ok.filter(e => e.o === '×' && e.l <= 2));
    if (dDiv >= .25) out.push([dDiv, `Division takes you about <b>${secs(dDiv)}</b> longer than the matching multiplication.`]);
    const mul = ok.filter(e => e.o === '×' && e.l <= 2), tbl = [];
    for (let n = 2; n <= 12; n++) { const l = mul.filter(e => e.x === n || e.y === n); if (l.length >= 5) tbl.push([n, median(l.map(t))]); }
    if (tbl.length >= 4) {
      tbl.sort((a, b) => b[1] - a[1]);
      const all = median(mul.map(t));
      if (tbl[0][1] - all >= .2) out.push([tbl[0][1] - all, `<b>×${tbl[0][0]}</b> is your slowest table at ${secs(tbl[0][1])}, against ${secs(all)} overall.`]);
    }
    const M = A.filter(e => !e.ok);
    if (M.length >= 6) {
      const cnt = {};
      for (const e of M) { const k = why(e).k; cnt[k] = (cnt[k] || 0) + 1; }
      const [k, v] = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
      if (k !== 'other' && v / M.length >= .3) out.push([.4, `Most of your misses are <b>${WHY_MANY[k]}</b> (${pct(v / M.length)}).`]);
    }

  }
  function secOps() {

    }
    const tiles = (o, match, lab) => {
      let h = '';
      for (let n = 2; n <= 12; n++) {
        const l = A.filter(e => e.o === o && match(e, n));
        if (l.length < 3) continue;
        const ok = l.filter(e => e.ok);
        h += `<div class="tt t${gradeAll(l)}" data-tip="${lab}${n} · ${pct(ok.length / l.length)} right · ${secs(median(ok.map(e => e.t)))} median · ${l.length} tries"><b>${lab}${n}</b><span>${secs(median(ok.map(e => e.t)))}</span></div>`;
      }
      return h;
    };

    const ins = insights();
    return `<section class="sec">${head('By operation', '計算')}
      ${rows.length ? `<div class="ops-t"><div class="oprow head"><span></span><span>accuracy</span><span></span><span>median</span><span>answers</span></div>${rows.join('')}</div>` : `<p class="empty">No answers with these filters.</p>`}
      ${mt ? `<p class="sub-h">Times tables, every problem with that number</p><div class="tables">${mt}</div>` : ''}
      ${dt ? `<p class="sub-h">Dividing by</p><div class="tables">${dt}</div>` : ''}
      ${ins.length ? `<ul class="ins">${ins.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</section>`;
  }

  function secPractice() {
    const counts = new Map();
    for (const e of LOG) if (e.ok && fits(e, true)) { const k = dayOf(e); counts.set(k, (counts.get(k) || 0) + 1); }
    if (V.mode === 'all' && V.level === 'all') for (const k of legacy.meta.days) if (!counts.has(k)) counts.set(k, -1);
    const weeks = clamp(Math.floor((colW(false) - 24) / 17), 8, 26);
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const start = new Date(today); start.setDate(start.getDate() - today.getDay() - (weeks - 1) * 7);
    let cells = '', months = '', played = 0, lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const first = new Date(start); first.setDate(first.getDate() + w * 7);
      months += `<span>${first.getMonth() !== lastMonth && first.getDate() <= 7 ? first.toLocaleDateString(undefined, { month: 'short' }) : ''}</span>`;
      if (first.getDate() <= 7) lastMonth = first.getMonth();
      for (let d = 0; d < 7; d++) {
        const dt = new Date(first); dt.setDate(dt.getDate() + d);
        const k = day(dt), v = counts.get(k), fut = dt > today;
        const lv = v === undefined ? 0 : v < 0 ? 2 : v < 20 ? 1 : v < 60 ? 2 : v < 150 ? 3 : 4;
        if (v !== undefined && !fut) played++;
        cells += `<i class="l${lv}${fut ? ' fut' : ''}${k === day() ? ' today' : ''}" data-tip="${esc(fmtDay(k))} · ${v === undefined ? 'no practice' : v < 0 ? 'played' : v + ' solved'}"></i>`;
      }
    }
    return `<section class="sec">${head('Practice', '練習')}
      <p class="note-line">Played <b>${played}</b> of the last ${weeks * 7} days. Brighter means more problems solved.</p>
      <div class="cal-wrap"><div class="cal-months">${months}</div>
        <div class="cal-body"><div class="cal-days"><span></span><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span></div><div class="cal">${cells}</div></div></div>
      <div class="cal-key">less <i class="l0" style="background:#161128"></i><i style="background:rgba(98,241,255,.22)"></i><i style="background:rgba(98,241,255,.42)"></i><i style="background:rgba(98,241,255,.68)"></i><i style="background:#7ff5ff"></i> more</div></section>`;
  }

  function secRecords() {
    const days = playDays(), EA = LOG.filter(e => fits(e, true)), ER = RUNS.filter(r => fits(r, true) && !r.q);
    let fastest = null;
    for (const e of EA) if (e.ok && (!fastest || e.t < fastest.t)) fastest = e;
    const perDay = new Map();
    for (const e of EA) if (e.ok) { const k = dayOf(e); perDay.set(k, (perDay.get(k) || 0) + 1); }
    let bestDay = null;
    for (const [k, v] of perDay) if (!bestDay || v > bestDay[1]) bestDay = [k, v];
    const topStreak = ER.reduce((a, r) => Math.max(a, r.top || 0), 0);
    const solvedAll = legacy.meta.solved + LOG.filter(e => e.ok).length;
    const timeAll = RUNS.reduce((a, r) => a + (r.dur || 0), 0);
    const modes = ['sprint', 'survival', 'flash'].filter(m => V.mode === 'all' || V.mode === m);
    const bestOf = (m, l) => {
      let b = 0;
      for (const r of ER) if (r.m === m && r.l === l && r.score > b) b = r.score;
      for (const [k, v] of Object.entries(legacy.bests)) { const [km, kl] = k.split(':'); if (km === m && +kl === l && v > b) b = v; }
      return b;
    };
    const table = modes.length ? `<div class="bests"><span></span>${[1, 2, 3, 4].map(l => `<span class="lvh"><span class="lv">${[1, 2, 3, 4].map(i => `<i${i <= l ? ' class="f"' : ''} style="height:${20 + i * 20}%"></i>`).join('')}</span></span>`).join('')}
      ${modes.map(m => `<span>${MODE_NAME[m]}</span>${[1, 2, 3, 4].map(l => `<b>${bestOf(m, l) || '–'}</b>`).join('')}`).join('')}</div>` : '';
    return `<section class="sec span2">${head('Records', '記録')}
      <div class="recs">
        <div class="rec"><b>${longestStreak(days)}</b><span>longest day streak</span></div>
        <div class="rec"><b>${topStreak || '–'}</b><span>most right in a row</span></div>
        <div class="rec"><b>${fastest ? secs(fastest.t) : '–'}</b><span>fastest answer</span>${fastest ? `<small>${esc(probText(fastest))} = ${fastest.a}</small>` : ''}</div>
        <div class="rec"><b>${bestDay ? bestDay[1] : '–'}</b><span>most solved in a day</span>${bestDay ? `<small>${esc(fmtDay(bestDay[0]))}</small>` : ''}</div>
        <div class="rec"><b>${solvedAll.toLocaleString()}</b><span>solved all time</span></div>
        <div class="rec"><b>${fmtDur(timeAll)}</b><span>practiced all time</span></div>
      </div>
      ${table ? `<p class="sub-h">Best scores by level</p>${table}` : ''}</section>`;
  }

  function secFoot() {
    const app = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    // the claude.ai preview can't hand out files, so backup lives only on the real site
    if (!document.querySelector('link[rel="manifest"]')) return `<div class="st-foot span2"><span>${LOG.length.toLocaleString()} answers logged in this preview.</span></div>`;
    return `<div class="st-foot span2"><span>Progress is saved on this device${app ? ', in this app' : ''}: ${LOG.length.toLocaleString()} answers logged.
      To combine devices, back up on one and restore on the other.</span>
      <button data-act="backup">Back up</button><button data-act="restore">Restore</button><span class="msg" id="foot-msg"></span></div>`;
  }

  /* ----- chart ----- */
  function ticks(lo, hi, n = 4) {
    const raw = (hi - lo || 1) / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag, out = [];
    for (let v = Math.floor(lo / step) * step; v < hi + step * .999; v += step) out.push(+v.toFixed(6));
    return out;
  }
  function lineChart(el, pts, o) {
    if (!pts.length) { el.innerHTML = ''; return; }
    const W = Math.max(280, Math.round(el.clientWidth)), H = 200, L = 44, Rt = 22, T = 18, B = 26;
    const vs = pts.map(p => p.v);
    const tk = ticks(o.lo != null ? o.lo : Math.min(...vs), o.hi != null ? Math.max(o.hi, ...vs) : Math.max(...vs) * 1.08 || 1);
    const lo = tk[0], hi = tk[tk.length - 1] > lo ? tk[tk.length - 1] : lo + 1;
    const X = i => pts.length === 1 ? (L + W - Rt) / 2 : L + i * (W - L - Rt) / (pts.length - 1);
    const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    let svg = `<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22eeff" stop-opacity=".22"/><stop offset="1" stop-color="#22eeff" stop-opacity="0"/></linearGradient></defs>`;
    for (const v of tk) svg += `<line class="gl" x1="${L}" x2="${W - Rt}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 3}" text-anchor="end">${o.fmt(v)}</text>`;
    const labelAt = new Set([0, pts.length - 1]);
    if (pts.length >= 5) labelAt.add(Math.floor((pts.length - 1) / 2));
    for (const i of labelAt) svg += `<text x="${X(i)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${esc(pts[i].label)}</text>`;
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
    if (pts.length > 1) svg += `<path d="${line}L${X(pts.length - 1).toFixed(1)},${Y(lo)}L${X(0).toFixed(1)},${Y(lo)}Z" fill="url(#cg)"/><path class="ln" d="${line}"/>`;
    if (pts.length <= 45) pts.forEach((p, i) => { if (i < pts.length - 1) svg += `<circle class="dt" cx="${X(i)}" cy="${Y(p.v)}" r="4"/>`; });
    const li = pts.length - 1;
    svg += `<circle class="end" cx="${X(li)}" cy="${Y(pts[li].v)}" r="5.5"/><text class="endv" x="${X(li)}" y="${Y(pts[li].v) - 11}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}">${o.fmt(pts[li].v, true)}</text>`;
    svg += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${svg}</svg>`;
    const xh = el.querySelector('.xh');
    const hover = ev => {
      const b = el.getBoundingClientRect(), x = (ev.clientX - b.left) / b.width * W;
      const i = pts.length === 1 ? 0 : clamp(Math.round((x - L) / ((W - L - Rt) / (pts.length - 1))), 0, pts.length - 1);
      xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('visibility', 'visible');
      showTip(pts[i].tip, b.left + X(i) / W * b.width, b.top + Y(pts[i].v) / H * b.height);
    };
    el.onpointermove = hover;
    el.onpointerdown = hover;
    el.onpointerleave = () => { xh.setAttribute('visibility', 'hidden'); hideTip(); };
  }
  function drawProgress() {
    const el = $('#ch-prog'), cap = $('#ch-cap');
    if (!el) return;
    if (V.chart === 'score') {
      const runs = R.filter(r => !r.q && r.m === V.mode), cnt = {};
      for (const r of runs) cnt[r.key] = (cnt[r.key] || 0) + 1;
      const key = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
      const list = key ? runs.filter(r => r.key === key).slice(-60) : [];
      lineChart(el, list.map(r => ({ v: r.score, label: shortDay(day(new Date(r.ts))), tip: `${esc(new Date(r.ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))} · <b>${r.score}</b>` })), { lo: 0, fmt: v => String(Math.round(v)), aria: 'Score per game' });
      if (key) { const [m, l, ops] = key.split(':'); cap.textContent = `Score per game in ${MODE_NAME[m]}, level ${l}${ops ? ', ' + opsText(ops) : ''}, your most played setup here.`; }
      else cap.textContent = 'No finished games with these filters yet.';
      return;
    }
    const D = byDay(A).filter(d => V.chart === 'accuracy' || Number.isFinite(d.med));
    if (V.chart === 'accuracy') {
      lineChart(el, D.map(d => ({ v: d.acc * 100, label: shortDay(d.k), tip: `${esc(fmtDay(d.k))} · <b>${pct(d.acc)}</b> · ${d.ok} of ${d.n}` })), { lo: Math.max(0, Math.floor((Math.min(...D.map(d => d.acc * 100)) - 5) / 10) * 10), hi: 100, fmt: v => Math.round(v) + '%', aria: 'Accuracy by day' });
      cap.textContent = 'Share of answers right, each day you played. Higher is better.';
    } else {
      lineChart(el, D.map(d => ({ v: d.med, label: shortDay(d.k), tip: `${esc(fmtDay(d.k))} · <b>${secs(d.med)}</b> median · ${d.n} answers` })), { lo: 0, fmt: (v, end) => end ? secs(v) : +v.toFixed(2) + 's', aria: 'Median answer time by day' });
      cap.textContent = 'Median seconds per correct answer, each day you played. Lower is faster.';
    }
  }

  /* ----- tooltip ----- */
  function showTip(html, x, y) {
    tip.innerHTML = html;
    tip.hidden = false;
    const w = tip.offsetWidth / 2 + 8;
    tip.style.left = clamp(x, w, innerWidth - w) + 'px';
    tip.style.top = Math.max(tip.offsetHeight + 16, y) + 'px';
  }
  function hideTip() { tip.hidden = true; }

  /* ----- render + events ----- */
  function render() {
    if (!V.mode) V.mode = settings.mode;
    t0 = since();
    A = LOG.filter(e => fits(e));
    R = RUNS.filter(r => fits(r));
    syncFilters();
    hideTip();
    body.innerHTML = `<div class="st-wrap">${secHero()}${secProgress()}${secTower()}${secProblems()}${secMistakes()}${secOps()}${secPractice()}${secRecords()}${secFoot()}</div>`;
    drawProgress();
    if (picked) { const c = $(`#tower .c[data-k="${picked}"]`); if (c) c.classList.add('sel'); }
  }
  function selectCell(c) {
    if (!c) return;
    for (const x of $$('#tower .c.sel')) x.classList.remove('sel');
    c.classList.add('sel');
    $('#cell-info').innerHTML = cellInfo(c.dataset.k);
  }
  $('#st-filters').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    V[b.parentElement.dataset.f] = b.dataset.v;
    more = false; save(); Sfx.ui(); render();
  });
  body.addEventListener('click', e => {
    const b = e.target.closest('button, .c');
    if (!b) return;
    if (b.classList.contains('c')) return selectCell(b);
    const set = b.parentElement && b.parentElement.dataset.set;
    if (set) {
      const top = body.scrollTop;
      V[set] = set === 'size' ? +b.dataset.v : b.dataset.v;
      if (set === 'ptab' || set === 'pop') more = false;
      save(); Sfx.ui(); render(); body.scrollTop = top;
      return;
    }
    if (b.classList.contains('prow')) {
      const i = +b.dataset.i, det = $('#pd-' + i), open = det.hidden;
      if (open) det.innerHTML = problemDetail(groupsShown[i]);
      det.hidden = !open;
      b.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open);
      return;
    }
    const act = b.dataset.act;
    if (act === 'more') { const top = body.scrollTop; more = !more; render(); body.scrollTop = top; }
    else if (act === 'backup') backup();
    else if (act === 'restore') $('#restore-file').click();
  });
  body.addEventListener('pointerover', e => {
    const c = e.target.closest('#tower .c');
    if (c && finePointer.matches) selectCell(c);
    const t = e.target.closest('[data-tip]');
    if (t) { const b = t.getBoundingClientRect(); showTip(esc(t.dataset.tip), b.left + b.width / 2, b.top); }
  });
  body.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
  body.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-tip]');
    if (t && !finePointer.matches) { const b = t.getBoundingClientRect(); showTip(esc(t.dataset.tip), b.left + b.width / 2, b.top); }
  });
  body.addEventListener('scroll', hideTip, { passive: true });

  /* ----- backup and restore (how two devices get merged) ----- */
  const footMsg = t => { const m = $('#foot-msg'); if (m) m.textContent = t; };
  function backup() {
    const name = `quick-math-${day()}.json`, text = JSON.stringify({ app: 'quickmath', v: 2, at: Date.now(), attempts: LOG, runs: RUNS, legacy });
    const blob = new Blob([text], { type: 'application/json' });
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (COARSE.matches && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); return; }
    } catch (e) {}
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    footMsg(`Downloading ${name}.`);
  }
  async function restore(file) {
    let d = null;
    try { d = JSON.parse(await file.text()); } catch (e) {}
    if (!d || d.app !== 'quickmath') { footMsg("That file isn't a Quick Math backup."); return; }
    const sig = e => `${e.ts}|${e.o}|${e.x}|${e.y}|${e.g}|${e.m}`, have = new Set(LOG.map(sig)), haveR = new Set(RUNS.map(r => r.ts + r.m));
    let added = 0;
    for (const e of d.attempts || []) if (e && e.ts && !have.has(sig(e))) { have.add(sig(e)); Data.add('attempts', e); added++; }
    for (const r of d.runs || []) if (r && r.ts && !haveR.has(r.ts + r.m)) { haveR.add(r.ts + r.m); Data.add('runs', r); }
    // the old running totals can only be merged once per source, or they'd double count
    const L = d.legacy, merged = store.get('merged', []), id = L && JSON.stringify([L.meta && L.meta.days, L.meta && L.meta.solved]);
    if (L && L.meta && !merged.includes(id) && id !== JSON.stringify([legacy.meta.days, legacy.meta.solved])) {
      legacy.meta.days = [...new Set([...legacy.meta.days, ...(L.meta.days || [])])].sort();
      legacy.meta.solved += L.meta.solved || 0;
      for (const [k, v] of Object.entries(L.bests || {})) legacy.bests[k] = Math.max(legacy.bests[k] || 0, v);
      for (const [k, v] of Object.entries(L.hist || {})) if (!legacy.hist[k]) legacy.hist[k] = v;
      for (const [k, f] of Object.entries(L.facts || {})) {
        const m = legacy.facts[k];
        if (!m) { legacy.facts[k] = f; continue; }
        const n = m.n + f.n;
        m.t = n ? +(((m.t || 0) * m.n + (f.t || 0) * f.n) / n).toFixed(3) : m.t;
        m.n = n; m.c += f.c;
      }
      saveLegacy();
      store.set('merged', merged.concat(id));
    }
    Data.sort();
    Data.rebuild();
    render();
    footMsg(added ? `Merged ${added.toLocaleString()} answers.` : 'Already up to date.');
  }
  $('#restore-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) restore(f); });

  return {
    open() {
      show('stats');
      render();
      body.scrollTop = 0;
      Data.load().then(() => { if (screen === 'stats') { const top = body.scrollTop; render(); body.scrollTop = top; } });
    },
    render() { const top = body.scrollTop; render(); body.scrollTop = top; },
  };
})();

/* ---------- menu ---------- */
function renderMenu() {
  for (const b of $$('.modes button')) { const on = b.dataset.mode === settings.mode; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); }
  for (const b of $$('.ops button')) { const on = settings.ops.includes(b.dataset.op); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }
  for (const b of $$('.levels button')) { const l = +b.dataset.level; b.classList.toggle('on', l <= settings.level); b.setAttribute('aria-checked', l === settings.level); }
  $('.ops').classList.toggle('off', settings.mode === 'flash');
  const best = settings.mode === 'zen' ? 0 : bestFor(cfgKey()), be = $('#best');
  be.style.visibility = best ? '' : 'hidden';
  be.querySelector('b').textContent = best;
  $('#b-sound').classList.toggle('muted', !settings.sound);
  $('#b-sound').setAttribute('aria-pressed', settings.sound);
}
function setMode(m) { settings.mode = m; saveSettings(); renderMenu(); Sfx.unlock(); Sfx.ui(); }
function setLevel(l) { l = clamp(l, 1, 4); if (l === settings.level) return; settings.level = l; saveSettings(); renderMenu(); Sfx.unlock(); Sfx.ui(); }
function toMenu(fromGame = true) {
  run = null;
  show('menu');
  renderMenu();
  if (!fromGame) return;
  City.ambient();
  Sfx.up();
}
const blurIfMouse = (e, b) => { if (e.detail) b.blur(); };
for (const b of $$('.modes button')) b.addEventListener('click', e => { setMode(b.dataset.mode); blurIfMouse(e, b); });
for (const b of $$('.levels button')) b.addEventListener('click', e => { setLevel(+b.dataset.level); blurIfMouse(e, b); });
for (const b of $$('.ops button')) b.addEventListener('click', e => {
  const o = b.dataset.op, on = settings.ops.includes(o);
  blurIfMouse(e, b);
  if (on && settings.ops.length === 1) { b.classList.remove('nope'); reflow(b); b.classList.add('nope'); return; }
  settings.ops = Object.keys(OPS).filter(x => x === o ? !on : settings.ops.includes(x));
  saveSettings(); renderMenu(); Sfx.unlock(); Sfx.ui();
});
$('#b-go').addEventListener('click', () => Game.start());
$('#b-again').addEventListener('click', () => Game.start());
$('#b-menu').addEventListener('click', () => toMenu());
$('#b-quit').addEventListener('click', () => Game.quit());
$('#b-stats').addEventListener('click', e => { Sfx.unlock(); Sfx.ui(); Stats.open(); blurIfMouse(e, e.currentTarget); });
$('#b-back').addEventListener('click', () => toMenu(false));
$('#b-sound').addEventListener('click', e => { settings.sound = !settings.sound; saveSettings(); renderMenu(); Sfx.unlock(); Sfx.ui(); blurIfMouse(e, e.currentTarget); });

$('#pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b) return;
  e.preventDefault();
  b.classList.add('down');
  setTimeout(() => b.classList.remove('down'), 110);
  Sfx.unlock(); Sfx.key();
  if (b.dataset.k === 'del') Game.back(); else Game.digit(b.dataset.k);
});

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  Sfx.unlock();
  if (screen === 'play') {
    if (k.length === 1 && k >= '0' && k <= '9') {
      e.preventDefault();
      if (!e.repeat) { if (COARSE.matches) document.body.classList.add('kbd'); Game.digit(k); }
    } else if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); Game.back(); }
    else if (k === 'Enter') { e.preventDefault(); Game.submit(); }
    else if (k === 'Escape') { e.preventDefault(); Game.quit(); }
    return;
  }
  if (screen === 'menu') {
    if ((k === 'Enter' || k === ' ') && !onButton) { e.preventDefault(); Game.start(); }
    else if (k === 'ArrowRight' || k === 'ArrowLeft') { e.preventDefault(); setMode(MODES[(MODES.indexOf(settings.mode) + (k === 'ArrowRight' ? 1 : 3)) % 4]); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); setLevel(settings.level + (k === 'ArrowUp' ? 1 : -1)); }
    return;
  }
  if (screen === 'results') {
    if (now() - resultsAt < 500) return;
    if ((k === 'Enter' || k === ' ') && !onButton) { e.preventDefault(); Game.start(); }
    else if (k === 'Escape') { e.preventDefault(); toMenu(); }
    return;
  }
  if (screen === 'stats' && (k === 'Escape' || k === 'Backspace')) { e.preventDefault(); toMenu(false); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) Game.pause(); else Game.resume(); });
addEventListener('blur', () => Game.pause());
addEventListener('focus', () => Game.resume());
document.addEventListener('gesturestart', e => e.preventDefault());
let rz = 0;
const buildCity = () => { try { City.build(); } catch (e) { console.error(e); } };
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { buildCity(); fit(); if (screen === 'stats') Stats.render(); }, 120); });

/* ---------- boot ---------- */
let last = 0, cityOk = true;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = last ? (ts - last) / 1000 : 0;
  last = ts;
  // the backdrop is decoration: if it ever fails, turn it off and keep the game running
  if (cityOk) try { City.update(Math.min(dt, .05)); } catch (e) { cityOk = false; console.error(e); }
  Game.tick(Math.min(dt, .25));
  if (cityOk) try { City.draw(); } catch (e) { cityOk = false; console.error(e); }
}
function boot() {
  buildCity();
  renderMenu();
  Data.load().then(() => { if (screen === 'menu') renderMenu(); });
  fit();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('900 32px "Zen Maru Gothic"', '暗算ラーメン'),
      document.fonts.load('40px "Tilt Neon"', '0123456789+−×÷='),
      document.fonts.load('600 22px "Martian Mono"', '0123456789'),
    ]).then(() => { City.refresh(); fit(); }).catch(() => {});
  }
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(() => boot());
else boot();
})();
</script>
